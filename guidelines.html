<style>
  /* ===== GLOBAL / MOBILE RESETS ===== */
  html, body { overflow-x: hidden; max-width: 100vw; }
  * { -webkit-tap-highlight-color: transparent; }
  button, .note-card, .cat-btn, .hl-pt { touch-action: manipulation; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; }

  @media (max-width: 640px) {
    input, select, textarea { font-size: 16px !important; }
  }

  /* ===== SCROLLBARS ===== */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  .dark ::-webkit-scrollbar-thumb { background: #475569; }

  /* ===== HEADER ===== */
  .glass-header { background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .dark .glass-header { background: rgba(15, 23, 42, 0.9); }

  /* ===== NOTE CARDS ===== */
  .note-card { transition: transform .2s ease, box-shadow .2s ease; }
  .note-card:hover { transform: translateY(-2px); }
  .blur-text { filter: blur(5px); user-select: none; transition: filter .2s ease; }
  .blur-text:hover { filter: blur(0); }

  /* ===== SIDEBAR ===== */
  #sidebar { transition: transform .3s ease; }

  /* ===== HIGHLIGHT MODE ===== */
  .hl-pt { cursor: default; }
  .hl-pt.hl-active-mode { cursor: pointer; }
  .hl-pt.hl-active-mode:hover { outline: 2px dashed #f59e0b; outline-offset: 1px; }

  /* ===== CATEGORY CHIPS ===== */
  .cat-btn { min-height: 36px; display: inline-flex; align-items: center; }
  @media (max-width: 640px) {
    .cat-btn { min-height: 40px; padding-left: 0.875rem; padding-right: 0.875rem; }
  }

  /* ===== FLIP CARD VIEW ===== */
  .flip-view .note-card {
    aspect-ratio: 3 / 4;
    min-height: 320px;
    cursor: pointer;
    perspective: 1200px;
  }
  @media (max-width: 640px) {
    .flip-view .note-card { min-height: 280px; }
    .flip-face { padding: 0.75rem; }
    .flip-back h3 { font-size: 0.95rem; }
  }
  .flip-view .note-card:hover { transform: none; }
  .flip-view .note-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
  }
  .flip-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 1rem;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    background: #fff;
    overflow: hidden;
  }
  .dark .flip-face { background: #1e293b; }
  .flip-back { transform: rotateY(180deg); overflow-y: auto; }
  .flip-back::-webkit-scrollbar { width: 4px; }
  .flip-back::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 999px; }

  /* ===== ALGORITHM STEP STYLES ===== */
  .algo-step {
    position: relative;
    padding-left: 28px;
    margin-bottom: 10px;
  }
  .algo-step::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 8px;
    bottom: -10px;
    width: 2px;
    background: #cbd5e1;
  }
  .dark .algo-step::before { background: #475569; }
  .algo-step:last-child::before { display: none; }
  .algo-step-num {
    position: absolute;
    left: 0;
    top: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #0ea5e9;
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  /* branch coloring by step type */
  .algo-step[data-type="yes"] .algo-step-num { background: #22c55e; }
  .algo-step[data-type="no"] .algo-step-num { background: #ef4444; }
  .algo-step[data-type="decision"] .algo-step-num { background: #f59e0b; }
  .algo-step[data-type="terminal"] .algo-step-num { background: #14b8a6; }
</style>
</head>

]},
{ id:"a6", category:"MANAGEMENT", system:"Cardiovascular", name:"Carotid Artery Stenosis", alt:"Carotid Stenosis Management", desc:"Medical vs surgical management based on stenosis severity and symptoms.", steps:[
  { label:"Suspected carotid stenosis", detail:"Initial evaluation.", type:"action" },
  { label:"Carotid duplex ultrasound", detail:"Confirm stenosis.", type:"action" },
  { label:"Stenosis detected (any degree)", detail:"Medical management to be continued long-term, beyond revascularization.", type:"action" },
  { label:"Stenosis < 50%", detail:"Revascularization usually not indicated.", type:"no" },
  { label:"Stenosis ≥ 50%", detail:"Assess symptoms.", type:"yes" },
  { label:"Asymptomatic", detail:"Moderate (50-69%): Consider revascularization · Severe (70-99%): Consider revascularization.", type:"no" },
  { label:"Symptomatic", detail:"Moderate (50-69%): Consider revascularization · Severe (70-99%): Revascularization is usually indicated.", type:"yes" }
]},
{ id:"a7", category:"MANAGEMENT", system:"Respiratory", name:"Initial Management of Acute Asthma Exacerbation", alt:"Asthma Exacerbation", desc:"Severity-based management of acute asthma.", steps:[
  { label:"Suspected acute asthma exacerbation", detail:"Initial evaluation to determine severity based on worst feature.", type:"action" },
  { label:"Mild or moderate", detail:"Speak in sentences, sits upright, not agitated, no accessory muscles · RR above baseline · HR 100-120 bpm · PEF > 50% · SpO₂ 90-95% on room air.", type:"yes" },
  { label:"Severe", detail:"Speak in words, sits in tripod position, agitated, uses accessory muscles · RR > 30/min · HR > 120 bpm · PEF ≤ 50% · SpO₂ < 90% on room air.", type:"no" },
  { label:"Life-threatening", detail:"Drowsiness, confusion, silent chest.", type:"decision" },
  { label:"Initial treatment (mild/moderate)", detail:"Oxygen · Inhaled SABA · PO glucocorticoids · Consider inhaled SAMA.", type:"action" },
  { label:"Maximize treatment (severe)", detail:"Oxygen · Nebulized SABA and SAMA · PO/IV glucocorticoids · Consider IV magnesium and ICS.", type:"action" },
  { label:"Consult critical care and prepare for intubation (life-threatening)", detail:"Immediate ICU consult.", type:"action" },
  { label:"Incomplete response", detail:"Escalate to severe treatment.", type:"action" },
  { label:"Poor response", detail:"Escalate to life-threatening management.", type:"action" }
]},
{ id:"a8", category:"DIAGNOSIS", system:"Respiratory", name:"Diagnostic Approach to Pulmonary Embolism", alt:"PE Diagnostic Algorithm", desc:"Stratifying by hemodynamic stability and pretest probability.", steps:[
  { label:"Suspected pulmonary embolism", detail:"Initial assessment.", type:"action" },
  { label:"Hemodynamically unstable?", detail:"Decision point.", type:"decision" },
  { label:"Stable", detail:"Estimate pretest probability (PTP) using Wells score or revised Geneva score.", type:"yes" },
  { label:"Unstable", detail:"Stabilize the patient. If stable enough for imaging → Imaging. If remains unstable → Bedside echocardiography.", type:"no" },
  { label:"Low PTP", detail:"Consider additional risk stratification (e.g., PERC rule). If PTP remains low → PE unlikely. If high PTP → D-dimer.", type:"no" },
  { label:"Intermediate PTP", detail:"Consider empiric anticoagulation based on bleeding risk. D-dimer: if high → Imaging.", type:"decision" },
  { label:"High PTP", detail:"Go directly to Imaging (CTPA or V/Q scan).", type:"yes" },
  { label:"D-dimer", detail:"Normal → PE unlikely. High → Imaging.", type:"action" },
  { label:"Imaging (CTPA or V/Q scan)", detail:"Negative → PE unlikely. Positive → Treat as pulmonary embolism.", type:"action" },
  { label:"Bedside echocardiography", detail:"RV dysfunction → Treat as PE. No RV dysfunction → PE unlikely, consider alternative diagnoses.", type:"action" }
]},
{ id:"a9", category:"DIAGNOSIS", system:"Respiratory", name:"Pulmonary Function Testing (PFTs) Interpretation", alt:"PFT Interpretation Algorithm", desc:"Spirometry-based differentiation of restrictive vs obstructive lung disease.", steps:[
  { label:"Pulmonary function testing (PFTs) interpretation", detail:"Spirometry, TLC, DLCO, bronchodilator challenge.", type:"action" },
  { label:"FEV₁/FVC ≥ 0.7?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Restrictive lung disease", detail:"Check FVC.", type:"yes" },
  { label:"No → Obstructive lung disease", detail:"Check FVC.", type:"no" },
  { label:"FVC ≥ 80% predicted?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Measure DLCO", detail:"↑: Polycythemia, pulmonary hemorrhage, L→R shunt, pregnancy. Normal: Healthy. ↓: Anemia, pulmonary edema, PAH, chronic VTE.", type:"yes" },
  { label:"No → TLC ≥ 80% predicted?", detail:"Decision point.", type:"no" },
  { label:"No → Restrictive lung disease", detail:"Measure DLCO. ≥ 75%: Chest wall or neuromuscular disorders. < 75%: Interstitial lung disease.", type:"no" },
  { label:"Yes → Mixed lung disease", detail:"Measure DLCO.", type:"yes" },
  { label:"Obstructive lung disease", detail:"Check TLC ≥ 80% predicted?", type:"action" },
  { label:"Yes → Obstructive lung disease", detail:"Measure DLCO. < 75%: Emphysematous COPD. ≥ 75%: Bronchodilator challenge test.", type:"yes" },
  { label:"No → Mixed lung disease", detail:"Measure DLCO.", type:"no" }
]},
{ id:"a10", category:"DIAGNOSIS", system:"Respiratory", name:"Dyspnea — Differential Diagnosis", alt:"Dyspnea Algorithm", desc:"Cardiac, respiratory, and non-cardiorespiratory causes of dyspnea.", steps:[
  { label:"Dyspnea", detail:"Initial assessment.", type:"action" },
  { label:"Cardiac vs Respiratory vs Non-cardiorespiratory", detail:"Decision point.", type:"decision" },
  { label:"Cardiac", detail:"Normal CXR → Acute: ACS, myocardial contusion, arrhythmias, myocarditis, acute pericarditis. Chronic: Arrhythmias, HOCM, restrictive CM, valvular heart disease. Abnormal CXR → Acute: Acute decompensated HF, CHF, pericardial effusion/cardiac tamponade. Chronic: Pericardial effusion, constrictive pericarditis, dilated cardiomyopathy.", type:"yes" },
  { label:"Respiratory", detail:"Obstructive airway disease · Lung parenchyma & pulmonary vessel disease · Disease of chest wall & pleural cavity.", type:"no" },
  { label:"Non-cardiorespiratory", detail:"CNS/neuromuscular · Toxic/metabolic · Others (psychogenic, AKI, ascites, large hiatal hernia, chronic aspiration, hepatopulmonary syndrome).", type:"decision" }
]},
{ id:"a11", category:"DIAGNOSIS", system:"Respiratory", name:"Hypoxemia — Diagnostic Approach", alt:"Hypoxemia Algorithm", desc:"A-a gradient based differentiation of hypoxemia causes.", steps:[
  { label:"Hypoxemia (PaO₂ < 75-80 mm Hg)", detail:"Type 1 respiratory failure: PaO₂ < 60 mm Hg.", type:"action" },
  { label:"Obtain ABG & calculate A-a gradient", detail:"Decision point.", type:"decision" },
  { label:"< Age/4 + 4 → Normal A-a gradient", detail:"Check PaCO₂.", type:"yes" },
  { label:"> Age/4 + 4 → ↑ A-a gradient", detail:"Check PaCO₂.", type:"no" },
  { label:"PaCO₂ ≤ 45 → ↓ FiO₂", detail:"e.g., high altitude.", type:"yes" },
  { label:"PaCO₂ > 45 → Hypoventilation", detail:"Type 2 RF: PaCO₂ > 50 mm Hg.", type:"no" },
  { label:"↓ Maximal inspiratory pressure (MIP)", detail:"Neuromuscular disease (GBS, MG, ALS) · ↓ Chest wall compliance (flail chest, kyphoscoliosis).", type:"no" },
  { label:"Normal MIP", detail:"CNS depression (opioids, toxic metabolic encephalopathy, OHS, central sleep apnea).", type:"yes" },
  { label:"PaCO₂ < 45 with ↑ A-a gradient", detail:"PaO₂ corrects easily with 100% O₂?", type:"decision" },
  { label:"No → Extreme right-to-left shunt (V/Q=0)", detail:"Cardiac: Eisenmenger, cyanotic heart disease · Vascular: pulmonary AVM · Alveolar: severe pneumonia, complete atelectasis, severe pulmonary edema, severe ARDS.", type:"no" },
  { label:"Yes → V/Q mismatch (most common)", detail:"or ↓ diffusion capacity (less common).", type:"yes" },
  { label:"PaCO₂ > 45 with ↑ A-a gradient", detail:"Type 2 RF: PaCO₂ > 50 mm Hg.", type:"decision" }
]},
{ id:"a12", category:"DIAGNOSIS", system:"Nephrology", name:"Diagnostic Approach to Hematuria", alt:"Hematuria Algorithm", desc:"From suspected hematuria to glomerular vs non-glomerular causes.", steps:[
  { label:"Suspected hematuria", detail:"Initial assessment.", type:"action" },
  { label:"History and/or signs of transient cause?", detail:"Trauma, urological procedure, UTI, nephrolithiasis, menstruation.", type:"decision" },
  { label:"Yes → Management of transient cause", detail:"Consult specialists as needed · Treat underlying cause · Consider repeat UA after treatment.", type:"yes" },
  { label:"No → Initial studies for all patients", detail:"CBC, BMP, urine dipstick, urinalysis, urine culture, spot urine protein:creatinine, urine microscopy, urine β-hCG.", type:"no" },
  { label:"RBCs on dipstick?", detail:"Decision point.", type:"decision" },
  { label:"No → Assess for mimics of hematuria", detail:"Hemoglobinuria, myoglobinuria.", type:"no" },
  { label:"Yes → Visible discoloration?", detail:"Decision point.", type:"yes" },
  { label:"Yes → Macroscopic hematuria", detail:"Consult urology for evaluation and management (e.g., bladder drainage).", type:"yes" },
  { label:"No → Urine microscopy", detail:"Decision point.", type:"no" },
  { label:"< 3 RBCs per HPF", detail:"Repeat UA 3x at 6-week intervals.", type:"no" },
  { label:"≥ 3 RBCs per HPF → Microscopic hematuria", detail:"Differentiate glomerular vs non-glomerular.", type:"yes" },
  { label:"Dysmorphic RBCs, RBC casts, and/or proteinuria → Glomerular hematuria", detail:"Consult nephrology.", type:"yes" },
  { label:"Normal RBCs → Nonglomerular hematuria", detail:"Assess malignancy risk.", type:"no" },
  { label:"Assess malignancy risk", detail:"Low → Repeat UA. Intermediate → Renal US and cystoscopy. High → CT urography and cystoscopy.", type:"decision" }
]},
{ id:"a13", category:"DIAGNOSIS", system:"Nephrology", name:"Diagnosis of Hypernatremia", alt:"Hypernatremia Algorithm", desc:"Volume status and urine osmolality based diagnosis.", steps:[
  { label:"Serum sodium > 145 mEq/L", detail:"Confirm hypernatremia.", type:"action" },
  { label:"Clinical evaluation to determine etiology", detail:"Decision point.", type:"decision" },
  { label:"Etiology clear: Diagnostic studies may not be needed", detail:"Treat underlying cause.", type:"yes" },
  { label:"Features of Cushing syndrome or primary hyperaldosteronism", detail:"Treat underlying cause.", type:"no" },
  { label:"Etiology unclear → Check urine osmolality", detail:"Decision point.", type:"decision" },
  { label:"> 600 mOsmol/kg → Implies extrarenal mechanism", detail:"Assess volume status.", type:"yes" },
  { label:"≤ 600 mOsmol/kg → Implies renal mechanism", detail:"Assess volume status.", type:"no" },
  { label:"Hypovolemic (extrarenal)", detail:"GI or skin loss.", type:"no" },
  { label:"Euvolemic (extrarenal)", detail:"Impaired thirst or lack of access to water.", type:"yes" },
  { label:"Hypervolemic (extrarenal)", detail:"Iatrogenic or ingestion.", type:"decision" },
  { label:"Hypovolemic (renal)", detail:"Diuretics or osmotic diuresis.", type:"no" },
  { label:"Euvolemic (renal)", detail:"Arginine vasopressin disorders.", type:"yes" },
  { label:"Hypervolemic (renal)", detail:"Either: Primary hyperaldosteronism · Cushing syndrome.", type:"decision" }
]},
{ id:"a14", category:"DIAGNOSIS", system:"Nephrology", name:"Diagnosis of Hyponatremia", alt:"Hyponatremia Algorithm", desc:"Serum osmolality and volume status based diagnosis.", steps:[
  { label:"Serum sodium < 135 mEq/L", detail:"Confirm hyponatremia.", type:"action" },
  { label:"Determine serum osmolality", detail:"Decision point.", type:"decision" },
  { label:"< 280 mOsm/kg → Hypotonic", detail:"Identify and treat underlying cause. Assess volume status.", type:"yes" },
  { label:"280-295 mOsm/kg → Isotonic", detail:"TURP syndrome · Pseudohyponatremia. Identify and treat underlying cause.", type:"no" },
  { label:"> 295 mOsm/kg → Hypertonic", detail:"Hyperglycemia · IV mannitol · IV radiocontrast. Identify and treat underlying cause.", type:"decision" },
  { label:"Hypovolemic", detail:"Uosm > 100 → ↓ UNa and/or ↓ FENa → Extrarenal: Diarrhea, vomiting, third spacing. ↑ UNa and/or ↑ FENa → Renal: Diuretic use, salt wasting, mineralocorticoid deficiency.", type:"no" },
  { label:"Euvolemic", detail:"Uosm ≤ 100 → ↓ UNa and/or ↓ FENa → Extrarenal: Primary polydipsia, beer potomania. Uosm > 100 → ↑ UNa and/or ↑ FENa → Renal: SIADH, hypocortisolism, hypothyroidism, reset osmostat.", type:"yes" },
  { label:"Hypervolemic", detail:"Uosm > 100 → ↓ UNa and/or ↑ FENa → Extrarenal: CHF, liver cirrhosis, hypoalbuminemia. ↑ UNa and/or ↑ FENa → Renal: Renal failure.", type:"decision" }
]},
{ id:"a15", category:"MANAGEMENT", system:"Nephrology", name:"Management of Hyponatremia", alt:"Hyponatremia Management", desc:"Severity-based management of hyponatremia.", steps:[
  { label:"Serum sodium < 135 mEq/L", detail:"Confirm hyponatremia.", type:"action" },
  { label:"Initial evaluation", detail:"Repeat BMP · Check serum glucose; calculate corrected sodium for hyperglycemia if applicable.", type:"action" },
  { label:"Confirmed hyponatremia", detail:"Decision point.", type:"decision" },
  { label:"Presence of any of the following?", detail:"Severe or moderately severe symptoms · Known or suspected intracranial pathology or elevated ICP · Acute hyponatremia (< 48 hours) with sodium decrease of > 10 mEq/L.", type:"decision" },
  { label:"Yes → Rapid correction", detail:"3% IV NaCl · Specialist consult · Monitor closely for signs of overcorrection.", type:"yes" },
  { label:"No → Determine serum osmolality", detail:"Decision point.", type:"no" },
  { label:"< 280 mOsm/kg → Hypotonic", detail:"Assess volume status and renal vs extrarenal cause.", type:"yes" },
  { label:"280-295 mOsm/kg → Isotonic", detail:"Fluid restriction.", type:"no" },
  { label:"> 295 mOsm/kg → Hypertonic", detail:"Identify and treat underlying cause.", type:"decision" },
  { label:"Hypovolemic (hypotonic)", detail:"Slow correction: IV isotonic saline · Monitor closely for signs of overcorrection.", type:"no" },
  { label:"Euvolemic (hypotonic)", detail:"Fluid restriction.", type:"yes" },
  { label:"Hypervolemic (hypotonic)", detail:"Fluid restriction +/- diuretics.", type:"decision" }
]},
{ id:"a16", category:"MANAGEMENT", system:"Nephrology", name:"Management of Hyperkalemia", alt:"Hyperkalemia Algorithm", desc:"Differentiating urgent from emergent treatment.", steps:[
  { label:"Hyperkalemia (K⁺ > 5.5 mEq/L)", detail:"Repeat K⁺ to exclude pseudohyperkalemia.", type:"action" },
  { label:"Obtain ECG and lab studies", detail:"BMP, blood gas, liver chemistries. Determine hyperK⁺ severity.", type:"action" },
  { label:"Evaluate for hyperkalemic emergency", detail:"≥ 1 of: Muscle weakness, paralysis · ECG changes · K⁺ > 6.0-6.5 mEq/L · Impaired K⁺ metabolism.", type:"decision" },
  { label:"No → Less urgent hyperkalemia", detail:"Identify and treat the cause (most common: renal impairment).", type:"no" },
  { label:"Yes → Hyperkalemic emergency", detail:"Treat and initiate continuous cardiac monitoring immediately.", type:"yes" },
  { label:"Cardiac membrane stabilization", detail:"If ECG changes: give calcium gluconate or calcium chloride.", type:"action" },
  { label:"Intracellular K⁺ shifting", detail:"Insulin with dextrose, consider adding SABA.", type:"action" },
  { label:"Serial ECG and repeat potassium", detail:"Monitor for hypoglycemia.", type:"action" },
  { label:"Repeat treatments if persistent hyperkalemia", detail:"Consider nephrology and critical care consults; hemodialysis for refractory hyperkalemia.", type:"action" },
  { label:"K⁺ excess", detail:"Kidney disease, hypocortisolism, hypoaldosteronism, drugs (ACEi), ↑ dietary K⁺ intake, type IV RTA.", type:"terminal" },
  { label:"↑ Extracellular K⁺ shift", detail:"Insulin deficiency, acidosis, DKA, drugs (beta blockers, digoxin, succinylcholine), hyperosmolality.", type:"terminal" },
  { label:"↑ Extracellular K⁺ release", detail:"Hemolysis, tumor lysis syndrome, rhabdomyolysis, pseudohyperkalemia (delayed sample).", type:"terminal" }
]},
{ id:"a17", category:"MANAGEMENT", system:"Nephrology", name:"Management of Hypokalemia", alt:"Hypokalemia Algorithm", desc:"Severity-based management of hypokalemia.", steps:[
  { label:"Serum potassium < 3.5 mEq/L", detail:"Confirm hypokalemia.", type:"action" },
  { label:"Initial evaluation", detail:"BMP including calcium · Serum magnesium, phosphate · ABG or VBG · ECG · Consider measuring urinary potassium.", type:"action" },
  { label:"Symptomatic hypokalemia?", detail:"Decision point.", type:"decision" },
  { label:"Yes → IV potassium chloride PLUS oral repletion if tolerated", detail:"Continuous cardiac monitoring · Repeat serum potassium every 2-4 hours · Consider ICU admission.", type:"yes" },
  { label:"No → Assess severity", detail:"Decision point.", type:"no" },
  { label:"Mild (3.0-3.4 mEq/L)", detail:"Consider oral potassium chloride supplementation.", type:"no" },
  { label:"Moderate (2.5-2.9 mEq/L)", detail:"Oral potassium chloride repletion.", type:"yes" },
  { label:"Severe (< 2.5 mEq/L) and/or high risk of recurrent severe hypokalemia", detail:"IV potassium chloride PLUS oral repletion if tolerated.", type:"decision" },
  { label:"Further management", detail:"Assess and treat underlying cause · Specialist consult as needed · Correct cautiously in impaired renal function.", type:"terminal" }
]},
{ id:"a18", category:"DIAGNOSIS", system:"Nephrology", name:"Diagnosis of Hypocalcemia", alt:"Hypocalcemia Algorithm", desc:"PTH-based differentiation of hypocalcemia causes.", steps:[
  { label:"Serum calcium < 8.5 mg/dL", detail:"Confirm hypocalcemia.", type:"action" },
  { label:"Either: Order ionized Ca²⁺ or Calculate Ca²⁺ corrected for albumin", detail:"Decision point.", type:"decision" },
  { label:"Normal Ca²⁺ → Factitious hypocalcemia", detail:"No treatment needed.", type:"no" },
  { label:"↓ Ca²⁺ → Confirmed hypocalcemia", detail:"Discontinue any medications that can cause hypocalcemia.", type:"yes" },
  { label:"Measure PTH", detail:"Decision point.", type:"decision" },
  { label:"Normal or ↓ PTH → Hypoparathyroidism", detail:"Treat with calcium and vitamin D.", type:"no" },
  { label:"↑ PTH → Measure phosphate, magnesium, calcidiol, and creatinine", detail:"Decision point.", type:"yes" },
  { label:"↓ Or normal phosphate + ↓ Calcidiol → Vitamin D deficiency", detail:"Treat with vitamin D.", type:"no" },
  { label:"↑ Phosphate + ↑ Creatinine → Chronic kidney disease", detail:"Treat CKD.", type:"yes" },
  { label:"↑ Phosphate → Pseudohypoparathyroidism", detail:"Treat with calcium and vitamin D.", type:"decision" },
  { label:"↓ Magnesium → Either: Malabsorption · Alcohol use disorder", detail:"Correct magnesium.", type:"terminal" }
]},
{ id:"a19", category:"DIAGNOSIS", system:"Nephrology", name:"Diagnosis of Hypercalcemia", alt:"Hypercalcemia Algorithm", desc:"PTH and PTHrP based differentiation of hypercalcemia.", steps:[
  { label:"↑ Serum calcium (incidental finding or suspected hypercalcemia)", detail:"Confirm hypercalcemia.", type:"action" },
  { label:"Order ionized Ca²⁺ or calculate Ca²⁺ corrected for serum albumin", detail:"Decision point.", type:"decision" },
  { label:"Normal Ca²⁺ → Remeasure after discontinuing interfering medications", detail:"Repeat testing.", type:"no" },
  { label:"↑ Ca²⁺ → Confirmed hypercalcemia", detail:"Check PTH.", type:"yes" },
  { label:"↑ PTH (+ ↓ Phosphate) → Primary hyperparathyroidism", detail:"Parathyroidectomy if indicated.", type:"yes" },
  { label:"↔/↑ PTH → Urine Ca²⁺", detail:"Decision point.", type:"decision" },
  { label:"↔/↑ Ca²⁺ → Familial hypocalciuric hypercalcemia", detail:"Usually no treatment needed.", type:"yes" },
  { label:"↓ Ca²⁺ → Hypercalcemia of malignancy", detail:"Treat underlying malignancy.", type:"no" },
  { label:"↓ PTH → PTHrP, Calcidiol and Calcitriol", detail:"Decision point.", type:"no" },
  { label:"↑ PTHrP → Hypercalcemia of malignancy", detail:"Treat underlying malignancy.", type:"yes" },
  { label:"↑ Calcitriol → Granulomatous diseases or lymphoma", detail:"Treat underlying disease.", type:"decision" },
  { label:"↑ Calcidiol → Vitamin D intoxication", detail:"Stop vitamin D.", type:"terminal" },
  { label:"Vit. D metabolites, ↔ PTHrP → Consider other causes", detail:"Further workup.", type:"terminal" }
]},
{ id:"a20", category:"DIAGNOSIS", system:"Endocrine", name:"Suspected Arginine Vasopressin Disorder", alt:"Diabetes Insipidus Algorithm", desc:"Water deprivation test and copeptin-based diagnosis.", steps:[
  { label:"Suspected AVP disorder", detail:"Initial evaluation.", type:"action" },
  { label:"Initial evaluation", detail:"Plasma osmolality (POsm), BMP · Urinalysis · 24-hour urine collection: volume and urine osmolality (UOsm).", type:"action" },
  { label:"High serum Na⁺ and/or POsm + Low UOsm → AVP disorder likely", detail:"Proceed to water deprivation test or plasma copeptin testing.", type:"yes" },
  { label:"Normal serum Na⁺ and POsm + Low UOsm → Diagnosis unclear", detail:"Proceed to water deprivation test or plasma copeptin testing.", type:"no" },
  { label:"Low serum Na⁺ and/or POsm + Very low UOsm → Primary polydipsia likely", detail:"Proceed to water deprivation test or plasma copeptin testing.", type:"decision" },
  { label:"Water deprivation test", detail:"POsm increases further, UOsm remains low.", type:"action" },
  { label:"UOsm < 300 → Administer desmopressin", detail:"No or minimal ↑ UOsm → AVP resistance. Significant ↑ UOsm → Complete AVP deficiency.", type:"no" },
  { label:"UOsm 300-800 → Administer desmopressin", detail:"Significant ↑ UOsm → Partial AVP deficiency. No or minimal ↑ UOsm → Primary polydipsia.", type:"yes" },
  { label:"Plasma copeptin testing", detail:"POsm and UOsm increase to normal level → Primary polydipsia.", type:"action" }
]},
{ id:"a21", category:"DIAGNOSIS", system:"Endocrine", name:"Evaluation of Hyperthyroidism", alt:"Hyperthyroidism Algorithm", desc:"TSH, free T4, and T3 based diagnosis of hyperthyroidism.", steps:[
  { label:"Hyperthyroidism suspected", detail:"Measure TSH, free T4, and total T3 levels.", type:"action" },
  { label:"↑ Or normal TSH + ↑ Free T4 + ↑ Total T3", detail:"Thyrotropic adenoma likely. MRI pituitary gland.", type:"yes" },
  { label:"↓ TSH + ↑ Free T4 + ↑ Total T3", detail:"Overt hyperthyroidism.", type:"no" },
  { label:"↓ TSH + Normal free T4 + Normal total T3", detail:"Measure β-hCG. Negative → Subclinical hyperthyroidism. Positive → Consider β-hCG-associated hyperthyroidism.", type:"decision" },
  { label:"Normal TSH + Normal free T4 + Normal total T3", detail:"Hyperthyroidism unlikely.", type:"terminal" },
  { label:"Diagnostic criteria met for Graves disease?", detail:"Decision point.", type:"decision" },
  { label:"Yes → High suspicion for Graves?", detail:"Check TRAb. Positive → Graves disease. Negative → Thyroid imaging.", type:"yes" },
  { label:"No → Thyroid imaging", detail:"Nuclear medicine thyroid scan · Radioactive iodine uptake · If unavailable, consider ultrasound with Doppler.", type:"no" },
  { label:"High uptake", detail:"Diffuse pattern → Graves. Nodular: One or two areas → Toxic adenoma. Multiple areas → Toxic multinodular goiter.", type:"yes" },
  { label:"Low uptake", detail:"Check anti-TPOAb and/or anti-TGAb. Positive → Hashitoxicosis. Negative → Measure thyroglobulin. High or normal → Endogenous hyperthyroidism. Low → Exogenous hyperthyroidism.", type:"no" }
]},
{ id:"a22", category:"DIAGNOSIS", system:"Endocrine", name:"Diagnosis of Hypothyroidism", alt:"Hypothyroidism Algorithm", desc:"TSH and free T4 based diagnosis of hypothyroidism.", steps:[
  { label:"Suspected hypothyroidism", detail:"Measure TSH.", type:"action" },
  { label:"Low TSH", detail:"Secondary or tertiary hypothyroidism likely. Measure FT4. Low → Secondary or tertiary hypothyroidism. Normal or high → Hyperthyroidism.", type:"no" },
  { label:"Normal TSH", detail:"Hypothyroidism unlikely.", type:"yes" },
  { label:"High TSH", detail:"Primary hypothyroidism likely. Measure FT4. Low → Primary hypothyroidism. Normal → Subclinical hypothyroidism.", type:"decision" }
]},
{ id:"a23", category:"DIAGNOSIS", system:"Endocrine", name:"Evaluation of Thyroid Nodule", alt:"Thyroid Nodule Algorithm", desc:"TSH, scintigraphy, and FNA-based evaluation.", steps:[
  { label:"Thyroid nodule", detail:"Initial evaluation: History and physical examination · TSH · Ultrasound of the neck.", type:"action" },
  { label:"TSH low", detail:"Thyroid scintigraphy. Hot nodule → Evaluate for hyperthyroidism. Cold nodule → Indications for fine needle aspiration?", type:"no" },
  { label:"TSH normal or elevated", detail:"Indications for fine needle aspiration?", type:"yes" },
  { label:"Indications for FNA?", detail:"Yes → Fine needle aspiration → Cytology. No → Monitor with thyroid ultrasound.", type:"decision" }
]},
{ id:"a24", category:"DIAGNOSIS", system:"Endocrine", name:"Clinical Features of Acromegaly", alt:"Acromegaly Algorithm", desc:"IGF-1 and OGTT-based diagnosis.", steps:[
  { label:"Clinical features of acromegaly", detail:"Initial assessment.", type:"action" },
  { label:"Serum IGF-1 analysis", detail:"Decision point.", type:"decision" },
  { label:"Normal → Acromegaly excluded", detail:"No further workup.", type:"no" },
  { label:"Elevated → OGTT and GH measurements", detail:"Decision point.", type:"yes" },
  { label:"GH suppressed 2 hours after OGTT?", detail:"Yes → Acromegaly excluded. No → Acromegaly confirmed.", type:"decision" },
  { label:"Acromegaly confirmed → Pituitary MRI", detail:"Visible mass → GH-secreting pituitary adenoma confirmed. Normal → Screen for extrapituitary cause.", type:"terminal" }
]},
{ id:"a25", category:"DIAGNOSIS", system:"Endocrine", name:"Suspected Adrenal Insufficiency (AI)", alt:"Adrenal Insufficiency Algorithm", desc:"Cortisol and ACTH-based diagnosis of adrenal insufficiency.", steps:[
  { label:"Suspected adrenal insufficiency (AI)", detail:"Fatigue, weakness, hyperpigmentation, salt and/or sugar craving.", type:"action" },
  { label:"Signs of adrenal crisis?", detail:"Refractory hypotension, impaired consciousness, severe abdominal pain, vomiting.", type:"decision" },
  { label:"Yes → Start empiric management", detail:"Hydrocortisone 100 mg IV · Fluid resuscitation · Treat hypoglycemia · Defer testing until stable.", type:"yes" },
  { label:"No → Measure morning cortisol", detail:"Decision point.", type:"no" },
  { label:"Low cortisol → Obtain morning ACTH and perform ACTH stimulation test", detail:"Measure cortisol rise.", type:"no" },
  { label:"High cortisol (e.g., ≥ 18 mcg/dL) → Consider alternative diagnoses", detail:"Rule out other causes.", type:"yes" },
  { label:"↑ ACTH → Primary AI", detail:"High morning ACTH PLUS no rise after stimulation. Level of defect: adrenal glands. Screen for hypoaldosteronism and hypoandrogenism. Measure 21-hydroxylase antibodies. Negative → Consider other causes. Positive → Autoimmune AI: screen for autoimmune polyendocrine syndrome.", type:"yes" },
  { label:"↓ ACTH → Secondary or tertiary AI", detail:"Low morning ACTH PLUS significant rise after stimulation. Level of defect: pituitary (secondary) or hypothalamus (tertiary). MRI pituitary. Lesion detected → Treat. No lesion → Consider other causes.", type:"no" }
]},
{ id:"a26", category:"DIAGNOSIS", system:"Endocrine", name:"Suspected Hyperaldosteronism", alt:"Hyperaldosteronism Algorithm", desc:"PAC, PRA, and confirmatory testing.", steps:[
  { label:"Suspected hyperaldosteronism (HTN + hypokalemia)", detail:"Initial assessment.", type:"action" },
  { label:"Measure plasma aldosterone (PAC) + renin activity (PRA)", detail:"Decision point.", type:"decision" },
  { label:"↑ PAC and ↑ PRA → Secondary hyperaldosteronism", detail:"Renal artery stenosis, renin-secreting tumor, CKD. Diagnostics and treatment for underlying cause.", type:"yes" },
  { label:"↑ PAC + ↓ PRA + PAC/PRA ratio > 20 → Confirmatory test", detail:"Oral sodium loading test, saline infusion test → Primary hyperaldosteronism.", type:"no" },
  { label:"↓ PAC and ↓ PRA → Pseudo-hyperaldosteronism", detail:"CAH, exogenous mineralocorticoid, Cushing's. Treat underlying cause.", type:"decision" },
  { label:"Primary hyperaldosteronism → Identify subtype", detail:"Adrenal CT. Malignancy? No → Adrenal venous sampling. Bilateral → Aldosterone receptor antagonists. Unilateral → Surgery (adrenalectomy). Yes → Consider surgery.", type:"terminal" }
]},
{ id:"a27", category:"DIAGNOSIS", system:"Endocrine", name:"Diabetes Mellitus Screening", alt:"DM Screening Algorithm", desc:"Risk-based screening for diabetes mellitus.", steps:[
  { label:"Diabetes mellitus screening", detail:"Initial assessment.", type:"action" },
  { label:"Signs or symptoms of hyperglycemia?", detail:"Decision point.", type:"decision" },
  { label:"No → Patient ≥ 35 years old?", detail:"Decision point.", type:"no" },
  { label:"No → Patient obese + 1 or more risk factors?", detail:"Decision point.", type:"no" },
  { label:"No → No testing", detail:"No screening needed.", type:"no" },
  { label:"Yes → HbA1C or FPG or OGTT 2-hour plasma glucose", detail:"Decision point.", type:"yes" },
  { label:"A1C ≥ 6.5% or FPG ≥ 126 or OGTT ≥ 200", detail:"Repeat test to confirm → Diabetes mellitus.", type:"yes" },
  { label:"A1C 5.7-6.4% or FPG 100-125 or OGTT 140-199", detail:"Repeat test to confirm → Prediabetes.", type:"no" },
  { label:"A1C < 5.7% or FPG < 100 or OGTT < 140", detail:"Repeat test to confirm → Healthy.", type:"decision" },
  { label:"Yes → Single random plasma glucose", detail:"≥ 200 mg/dL → Diabetes mellitus.", type:"yes" }
]},
{ id:"a28", category:"MANAGEMENT", system:"Gastroenterology", name:"Management of Acute Upper GI Bleeding (UGIB)", alt:"UGIB Algorithm", desc:"Hemodynamic stability-based management of upper GI bleeding.", steps:[
  { label:"Features suggesting acute UGIB", detail:"Hematemesis, melena.", type:"action" },
  { label:"Hemodynamically unstable?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Stabilization", detail:"Urgent specialist consult, large-bore IV access, NPO · Consider: Intubation, IV fluid resuscitation, Blood products, Anticoagulant reversal.", type:"yes" },
  { label:"No → Empiric pharmacological treatment", detail:"Consider erythromycin · Suspected variceal bleeding: Octreotide or vasopressin PLUS ceftriaxone.", type:"no" },
  { label:"Emergency EGD (unstable)", detail:"Concurrent empiric pharmacological treatment if it does not delay EGD.", type:"action" },
  { label:"Nonemergency EGD (stable)", detail:"Bleeding source identified → Hemostasis. Bleeding source not identified → Melena? Yes → Colonoscopy. No → Mesenteric angiography.", type:"action" },
  { label:"Bleeding source identified (emergency EGD)", detail:"Hemostasis.", type:"yes" },
  { label:"Contraindicated or bleeding source not identified", detail:"Mesenteric angiography. Source identified → Hemostasis. Source not identified → Evaluation for small bowel bleeding.", type:"no" }
]},
{ id:"a29", category:"MANAGEMENT", system:"Gastroenterology", name:"Management of Acute Lower GI Bleeding (LGIB)", alt:"LGIB Algorithm", desc:"Hemodynamic stability-based management of lower GI bleeding.", steps:[
  { label:"Features suggesting acute LGIB", detail:"Hematochezia.", type:"action" },
  { label:"Hemodynamically unstable?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Stabilization", detail:"Urgent specialist consult, large-bore IV access, NPO · Consider: IV fluid resuscitation, Blood products, Anticoagulant reversal.", type:"yes" },
  { label:"No → Both: Tolerating bowel preparation and Low suspicion of active bleeding?", detail:"Nonemergency colonoscopy with bowel preparation.", type:"no" },
  { label:"CT angiography", detail:"Bleeding source identified → If not previously done: colonoscopy. Source not identified → Hemostasis. Source not identified → Consider other diagnoses.", type:"action" }
]},
{ id:"a30", category:"DIAGNOSIS", system:"Gastroenterology", name:"Differential Diagnosis of Jaundice", alt:"Jaundice Algorithm", desc:"Bilirubin and LFT-based differentiation of jaundice.", steps:[
  { label:"Jaundice", detail:"Measure bilirubin.", type:"action" },
  { label:"↑ Indirect bilirubin → Unconjugated hyperbilirubinemia", detail:"Increased hemoglobin breakdown (hemolysis, impaired erythropoiesis, resolving hematoma, internal hemorrhage) · Impaired hepatic uptake (drugs, portosystemic shunt) · Impaired conjugation (Gilbert, Crigler-Najjar, neonatal jaundice).", type:"yes" },
  { label:"↑ Direct bilirubin → Conjugated hyperbilirubinemia", detail:"Liver function tests. ↑ AST and ALT → Hepatocellular injury. ↑ ALP and γ-GT → Cholestasis. All normal → ↓ Excretion or reuptake of bilirubin.", type:"no" },
  { label:"Hepatocellular injury", detail:"ALT > AST: Hepatitis A/B/C, drug/toxins, autoimmune hepatitis. AST > ALT: Alcohol-associated liver disease, acute liver failure, decompensated cirrhosis, HCC.", type:"action" },
  { label:"Cholestasis", detail:"Imaging for bile duct evaluation. Normal bile duct → Intrahepatic cholestasis: Liver disease, PBC, drugs/toxins, sepsis, postoperative, pregnancy. Dilated bile duct → Biliary obstruction: Choledocholithiasis, tumors, PSC, pancreatitis.", type:"action" },
  { label:"↓ Excretion or reuptake of bilirubin", detail:"Either: Dubin-Johnson syndrome · Rotor syndrome.", type:"terminal" }
]},
{ id:"a31", category:"MANAGEMENT", system:"Gastroenterology", name:"Acute Diverticulitis", alt:"Diverticulitis Algorithm", desc:"Complicated vs uncomplicated management.", steps:[
  { label:"Acute diverticulitis", detail:"Initial assessment.", type:"action" },
  { label:"Immunocompetent + history of uncomplicated diverticulitis with similar symptoms?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Outpatient treatment", detail:"Clear liquid diet; PO analgesics, antiemetics.", type:"yes" },
  { label:"No → Labs: CBC, BMP, CRP; consider blood culture", detail:"Imaging: abdominal CT.", type:"no" },
  { label:"Complicated disease?", detail:"Perforation, abscess, fecal peritonitis, bowel obstruction, fistula.", type:"decision" },
  { label:"No → Uncomplicated diverticulitis", detail:"Presence of any of the following? Systemic signs of infection, WBC > 15 × 10⁹, CRP > 140 mg/L, ASA class III or IV, duration > 5 days, vomiting, pregnancy, immunosuppression, comorbidities, fluid collections on CT.", type:"no" },
  { label:"Yes → Inpatient treatment", detail:"NPO, IV fluids; IV analgesics, antiemetics. Empiric IV antibiotics. Perforation OR generalized peritonitis? → Emergent surgery. Bowel obstruction? → Refer to bowel obstruction article. Abscess present? → Abscess ≥ 4 cm? → US/CT-guided drainage OR surgery. No → Conservative management with IV antibiotics.", type:"yes" },
  { label:"Empiric PO antibiotics", detail:"Metronidazole + ciprofloxacin/levofloxacin/TMP-SMX OR Amoxicillin-clavulanate OR Moxifloxacin.", type:"action" },
  { label:"Follow-up in 2-3 days", detail:"Worsening or no improvement → Repeat imaging and consider inpatient management. Improvement → Advance diet as tolerated.", type:"action" },
  { label:"Subsequent management", detail:"6-8 weeks after resolution: screening colonoscopy to rule out malignancy.", type:"terminal" }
]},
{ id:"a32", category:"MANAGEMENT", system:"Gastroenterology", name:"Suspected Bowel Obstruction (BO)", alt:"Bowel Obstruction Algorithm", desc:"ABCDE approach and definitive management of bowel obstruction.", steps:[
  { label:"Suspected bowel obstruction (BO)", detail:"Initial assessment.", type:"action" },
  { label:"ABCDE approach as needed", detail:"Secure airway, administer oxygen, volume resuscitation.", type:"action" },
  { label:"Start basic management", detail:"2 large-bore IVs and keep NPO · Maintenance IV fluids and electrolyte repletion · NG tube if vomiting or distended · Supportive care: Analgesia, Antiemetics, Empiric antibiotics if fever/leukocytosis/perforation/strangulation.", type:"action" },
  { label:"Urgent general surgery consult", detail:"Decision point.", type:"decision" },
  { label:"Unstable patient", detail:"AXR or bedside US. If patient stabilizes → CT abdomen and pelvis with IV contrast.", type:"no" },
  { label:"Stable patient", detail:"CT abdomen and pelvis with IV contrast.", type:"yes" },
  { label:"Definitive management", detail:"Surgical, endoscopic, or nonoperative depending on severity and etiology.", type:"terminal" }
]},
{ id:"a33", category:"MANAGEMENT", system:"Gastroenterology", name:"Suspected Esophageal Perforation", alt:"Boerhaave Syndrome Algorithm", desc:"Diagnosis and management of esophageal perforation.", steps:[
  { label:"Esophageal perforation suspected", detail:"History of endoscopy or vomiting/retching, retrosternal pain, suprasternal crepitus, Hamman sign.", type:"action" },
  { label:"X-ray of the neck and chest (PA and lateral)", detail:"Findings: Widened mediastinum · Pneumomediastinum · Pneumothorax · Pneumoperitoneum · Subcutaneous emphysema · Pleural effusion · Mediastinal air-fluid levels.", type:"action" },
  { label:"Any of the following?", detail:"Patient unstable/uncooperative · Pneumoperitoneum.", type:"decision" },
  { label:"No → Contrast esophagram with gastrographin", detail:"Positive → Esophageal rupture. Negative → Contrast esophagram with barium. Inconclusive → CT scan (with oral contrast).", type:"no" },
  { label:"Yes → CT scan (with oral contrast)", detail:"Contrast extravasation, esophageal wall edema, periesophageal fluid ± gas bubbles, extraluminal air.", type:"yes" },
  { label:"CT scan result", detail:"Inconclusive + endoscopy planned → Endoscopy. Perforation visualized → Esophageal rupture. Perforation ruled out → Consider other diagnoses.", type:"action" },
  { label:"Esophageal rupture/Boerhaave syndrome", detail:"Initial management: Stabilize ABCDE · NPO · IV broad-spectrum abx · IV PPI · IV analgesics.", type:"action" },
  { label:"Size of perforation?", detail:"Small, contained → Suitable for nonsurgical treatment? Yes → Nonsurgical treatment. No → Surgical repair. Large, free → Surgical repair.", type:"decision" }
]},
{ id:"a34", category:"MANAGEMENT", system:"Gastroenterology", name:"Suspected Esophageal Variceal Hemorrhage", alt:"Variceal Bleed Algorithm", desc:"Resuscitation and management of variceal hemorrhage.", steps:[
  { label:"Suspected esophageal variceal hemorrhage", detail:"Sudden-onset hematemesis and/or melena with alcoholism/portal HTN.", type:"action" },
  { label:"Resuscitation and stabilization", detail:"At least two large-bore IVs, volume replacement; consider airway protection, blood transfusions, and vitamin K.", type:"action" },
  { label:"Octreotide", detail:"Duration: 3-5 days (or other vasoactive drug).", type:"action" },
  { label:"IV antibiotic prophylaxis", detail:"Prevents SBP and other infections.", type:"action" },
  { label:"Patient hemodynamically stable?", detail:"Decision point.", type:"decision" },
  { label:"No → Consider balloon tamponade until patient stabilizes", detail:"Temporary measure.", type:"no" },
  { label:"Yes → Upper endoscopy", detail:"Confirmed esophageal variceal bleeding.", type:"yes" },
  { label:"Confirmed esophageal variceal bleeding", detail:"Procedure of choice → Endoscopic band ligation. Extreme bleeding → Balloon tamponade. Alternative → Injection sclerotherapy.", type:"action" },
  { label:"Hemostasis", detail:"Achieved.", type:"terminal" },
  { label:"Secondary prophylaxis", detail:"Nonselective beta-blockers (e.g., propranolol) + endoscopic band ligation.", type:"action" },
  { label:"Rebleeding", detail:"Repeat endoscopy. Failure → TIPS.", type:"action" }
]},
{ id:"a35", category:"DIAGNOSIS", system:"Gastroenterology", name:"Suspected GERD", alt:"GERD Algorithm", desc:"Symptom-based evaluation of GERD.", steps:[
  { label:"Suspected GERD", detail:"Either: Atypical symptoms · Typical symptoms · Extraesophageal symptoms.", type:"action" },
  { label:"Chest pain?", detail:"Yes → Exclude cardiac cause (ECG, troponin). No → Alarm symptoms?", type:"decision" },
  { label:"Alarm symptoms?", detail:"Dysphagia, odynophagia, early satiety, anemia, GI bleed, persistent vomiting, unintentional weight loss, aspiration pneumonia. Yes → Upper GI endoscopy. No → High risk for Barrett esophagus?", type:"decision" },
  { label:"High risk for Barrett esophagus?", detail:"Male, European descent, age ≥ 50, obese, symptoms ≥ 5 years. Yes → Upper GI endoscopy. No → Empiric therapy: PPI for 8 weeks + Lifestyle modifications.", type:"decision" },
  { label:"Empiric therapy response", detail:"Improvement → Assumed GERD. No response → Consider further diagnostic evaluation. Partial → Optimize PPI therapy.", type:"action" },
  { label:"Upper GI endoscopy", detail:"Normal → Esophageal pH monitoring (if suspected NERD). Abnormal → NERD or ERD.", type:"action" },
  { label:"Esophageal pH monitoring", detail:"Abnormal pH → NERD or ERD. Normal pH → Consider further diagnostic evaluation.", type:"action" }
]},
{ id:"a36", category:"MANAGEMENT", system:"Gastroenterology", name:"Suspected Acute Pancreatitis", alt:"Pancreatitis Algorithm", desc:"Diagnosis and management of acute pancreatitis.", steps:[
  { label:"Suspected acute pancreatitis", detail:"Epigastric pain radiating to back, nausea, vomiting.", type:"action" },
  { label:"Diagnosis", detail:"2 of 3: Characteristic abdominal pain · Serum lipase/amylase > 3x ULN · Characteristic findings on cross-sectional imaging.", type:"action" },
  { label:"Initial management", detail:"Aggressive IV fluid resuscitation (Ringer's lactate) · Analgesia (opioids) · Antiemetics · NPO initially, then early enteral nutrition · Treat underlying cause.", type:"action" },
  { label:"Assess severity", detail:"Mild (no organ failure, no local complications) → Supportive care. Moderately severe (transient organ failure < 48h or local complications) → Supportive care + monitor. Severe (persistent organ failure > 48h) → ICU admission.", type:"action" }
]},
{ id:"a37", category:"MANAGEMENT", system:"Infectious Disease", name:"Management of Suspected Meningitis", alt:"Meningitis Algorithm", desc:"Empiric therapy and LP-based management.", steps:[
  { label:"Suspected meningitis", detail:"Initial evaluation and stabilization.", type:"action" },
  { label:"Initial evaluation and stabilization", detail:"Initiate droplet precautions · Emergency stabilization · IV access, 2 sets blood cultures · CBC, BMP, CRP, coagulation panel.", type:"action" },
  { label:"Contraindications to LP?", detail:"Decision point.", type:"decision" },
  { label:"No → LP for CSF analysis, PCR, culture", detail:"Empiric therapy ASAP: IV antimicrobial therapy PLUS IV dexamethasone.", type:"no" },
  { label:"Yes → Start empiric therapy immediately", detail:"IV antimicrobial therapy PLUS IV dexamethasone. Signs of raised ICP? Yes → Neuroimaging. Increased risk of herniation? Yes → Neurosurgical consult. No → LP.", type:"yes" },
  { label:"CSF findings", detail:"Viral: Leukocytes 10-500, ↑ Lymphocytes, Normal glucose, ↑ Protein → Discontinue antibiotics. Bacterial: Leukocytes > 1000, ↑ Granulocytes, ↓ Glucose → Continue empiric therapy. Normal/Inconclusive → Consider DDx.", type:"action" },
  { label:"Adjust therapy according to PCR and culture results", detail:"Consult infectious diseases · Provide postexposure prophylaxis if indicated.", type:"terminal" }
]},
{ id:"a38", category:"MANAGEMENT", system:"Infectious Disease", name:"Treatment of Community-Acquired Pneumonia (CAP)", alt:"CAP Algorithm", desc:"PSI/CURB-65 based outpatient vs inpatient management.", steps:[
  { label:"Treatment of community-acquired pneumonia (CAP)", detail:"Calculate PSI or CURB-65 score to assess need for hospitalization.", type:"action" },
  { label:"PSI ≤ 70, CURB-65 ≤ 1 → Outpatient treatment", detail:"Comorbidities or risk factors for resistant pathogens? (Chronic heart/lung/renal/hepatic disease · Immunosuppressed · IV antibiotics in past 90 days). No → Monotherapy: Amoxicillin, Doxycycline, Macrolide. Yes → Combination therapy: β-lactam + macrolide OR respiratory fluoroquinolone.", type:"yes" },
  { label:"PSI > 90, CURB-65 ≥ 2 → Inpatient treatment", detail:"Suspected pseudomonas? Yes → Antipseudomonal β-lactam IV. No → Hypotension requiring vasopressors OR respiratory failure? No → Severe CAP criteria met? No → Non-ICU: β-lactam IV + Azithromycin/Clarithromycin/Doxycycline. Yes → ICU: β-lactam IV + Azithromycin/Clarithromycin/Doxycycline/Levofloxacin/Moxifloxacin. Yes → ICU.", type:"no" },
  { label:"Suspected MRSA involvement?", detail:"Previous MRSA in sputum, severe CAP with recent hospitalization, IV antibiotics in past 90 days. Yes → Add anti-MRSA therapy: Vancomycin IV or linezolid PO.", type:"decision" }
]},
{ id:"a39", category:"DIAGNOSIS", system:"Infectious Disease", name:"Serological Testing Algorithm for Syphilis", alt:"Syphilis Serology Algorithm", desc:"Standard vs reverse algorithm for syphilis testing.", steps:[
  { label:"Either: Features of syphilis · Candidate for screening", detail:"Choice depends on local laboratory.", type:"action" },
  { label:"Standard algorithm", detail:"First test: NTT. Positive → TT. Negative → Assess risk status.", type:"no" },
  { label:"Reverse algorithm", detail:"First test: TT. Negative → Assess risk status. Positive → NTT. Negative → Perform different TT. Positive → Current or past syphilis likely.", type:"yes" },
  { label:"Assess risk status", detail:"Low → Syphilis unlikely. High → Early primary syphilis cannot be excluded. Presumptive treatment, retest after 2-4 weeks.", type:"decision" },
  { label:"Current or past syphilis likely", detail:"Positive NTT and TT. Treat as syphilis.", type:"terminal" },
  { label:"First test likely false positive", detail:"Negative NTT and TT. Repeat testing after 2-4 weeks in patients with risk factors.", type:"terminal" }
]},
{ id:"a40", category:"MANAGEMENT", system:"Infectious Disease", name:"Management of Lyme Disease", alt:"Lyme Disease Algorithm", desc:"Erythema migrans and serology-based management.", steps:[
  { label:"Confirmed or possible tick bite", detail:"Initial assessment.", type:"action" },
  { label:"Erythema migrans?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Antibiotic treatment", detail:"Doxycycline, amoxicillin, or cefuroxime.", type:"yes" },
  { label:"No → Symptoms of early or late disseminated Lyme disease?", detail:"Decision point.", type:"no" },
  { label:"Yes → Serological testing", detail:"Positive → Antibiotic treatment. Negative → Consider other causes.", type:"yes" },
  { label:"No → Criteria met for Lyme disease PEP?", detail:"Decision point.", type:"no" },
  { label:"Yes → PEP for Lyme disease", detail:"Single dose of doxycycline 200 mg.", type:"yes" },
  { label:"No → Lyme disease unlikely", detail:"No treatment needed.", type:"no" }
]},
{ id:"a41", category:"MANAGEMENT", system:"Infectious Disease", name:"Pharmacotherapy for the Agitated or Violent Patient", alt:"Agitation Algorithm", desc:"Etiology-based pharmacotherapy for agitation.", steps:[
  { label:"Medications for agitation indicated", detail:"Patient is a clear danger to self or other and unresponsive to nonpharmacological methods.", type:"action" },
  { label:"Treat critical or easily reversible causes first or concurrently", detail:"Hypoxia, shock, hypoglycemia, pain, seizure, acute urinary retention.", type:"action" },
  { label:"Very severe agitation or violent behavior?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Consider: Antipsychotics + Benzodiazepines · Ketamine", detail:"Rapid tranquilization.", type:"yes" },
  { label:"No → Etiology-based treatment", detail:"Delirium or psychotic disorder → Antipsychotics + BZDs · Ketamine. Unknown history → Psychosis? Yes → 2nd-gen antipsychotic (olanzapine, risperidone). No → Benzodiazepine (lorazepam, midazolam). CNS stimulant intoxication or depressant withdrawal → Benzodiazepine. CNS depressant intoxication → 1st-gen antipsychotic (haloperidol).", type:"no" },
  { label:"Safe approach to pharmacotherapy", detail:"Start at lowest possible dose (reduce for older adults) · Monitor for oversedation, hemodynamic instability, respiratory compromise · Repeat only if necessary.", type:"action" },
  { label:"Refractory agitation?", detail:"Yes → Reassess and consider alternative agents. No → Discontinue medication as soon as possible.", type:"decision" }
]},
{ id:"a42", category:"DIAGNOSIS", system:"Hematology", name:"Diagnosis of Anemia", alt:"Anemia Algorithm", desc:"MCV-based classification of anemia.", steps:[
  { label:"Anemia", detail:"↓ Hemoglobin. Measure MCV.", type:"action" },
  { label:"Microcytic (MCV < 80 fL)", detail:"↓ Ferritin → ↑ TIBC → Iron deficiency. ↔/↑ Ferritin → ↔/↓ TIBC → ↑ CRP/ESR → Anemia of chronic disease. Abnormal Hb electrophoresis → β-Thalassemia, Hb H disease, Hb Bart. Basophilic stippling and/or ringed sideroblasts → Sideroblastic anemia, Lead poisoning.", type:"yes" },
  { label:"Normocytic (MCV 80-100 fL)", detail:"↓ Reticulocytes → ↓ EPO → CKD. ↔/↑ EPO, Pancytopenia → Aplastic anemia. ↔/↑ Reticulocytes → Signs of hemolysis? (↓ Haptoglobin, ↑ LDH, ↑ Indirect bilirubin). No → Blood loss. Yes → Hemolytic anemia.", type:"no" },
  { label:"Macrocytic (MCV > 100 fL)", detail:"Megaloblastic changes on smear? No → Reticulocytosis, Liver disease, Alcohol use, MDS, Hypothyroidism, Multiple myeloma. Yes → Folate and/or B12 deficiency.", type:"decision" }
]},
{ id:"a43", category:"DIAGNOSIS", system:"Hematology", name:"Suspected Iron Deficiency Anemia", alt:"Iron Deficiency Algorithm", desc:"Ferritin-based diagnosis of iron deficiency.", steps:[
  { label:"Suspected iron deficiency anemia", detail:"Hb < 13 g/dL (M), < 12 g/dL (F), < 11 g/dL (pregnant). Normocytic or microcytic.", type:"action" },
  { label:"Obtain serum ferritin", detail:"Decision point.", type:"decision" },
  { label:"Ferritin < 45 ng/mL", detail:"↑ TIBC, ↓ TSAT, low serum iron → Iron deficiency anemia.", type:"yes" },
  { label:"Ferritin 45-100 ng/mL", detail:"Get iron, transferrin, TIBC, TSAT. Any other result → sTfR. Normal sTfR → FEP. FEP not elevated but high suspicion → Bone marrow biopsy. Decreased/absent iron stores → Iron deficiency anemia.", type:"no" },
  { label:"Ferritin 101-500 ng/mL", detail:"Comorbid chronic inflammatory state? (CKD, CHF). Yes → Get iron, transferrin, TIBC, TSAT. No → ↓ TIBC, ↑ TSAT, high serum iron → IDA unlikely.", type:"decision" },
  { label:"Ferritin > 500 ng/mL", detail:"↓ TIBC, ↑ TSAT, high serum iron → IDA unlikely.", type:"terminal" }
]},
{ id:"a44", category:"MANAGEMENT", system:"Neurology", name:"Evaluation and Management of Ischemic Stroke", alt:"Stroke Algorithm", desc:"Time-based thrombolysis and thrombectomy decision.", steps:[
  { label:"Patient with features suggestive of stroke", detail:"Sudden-onset focal neurological deficits.", type:"action" },
  { label:"Check POC glucose", detail:"To rule out stroke mimics.", type:"action" },
  { label:"Initial evaluation (do not delay imaging)", detail:"ECG, CBC, BMP, troponin, coagulation panel · Establish time of symptom onset · Assess severity (NIHSS) · Stabilize and monitor BP, ICP, glucose · Neurology consult.", type:"action" },
  { label:"Emergency noncontrast CT or MRI head", detail:"Decision point.", type:"decision" },
  { label:"Bleeding present → Manage hemorrhage", detail:"Reverse anticoagulation, neurosurgery consult.", type:"no" },
  { label:"Bleeding absent → Contraindications for IV thrombolysis?", detail:"Decision point.", type:"yes" },
  { label:"Yes → Neurovascular studies", detail:"To assess for thrombectomy.", type:"yes" },
  { label:"No → Time since symptom onset", detail:"Decision point.", type:"no" },
  { label:"≤ 3 hrs", detail:"Administer IV thrombolysis.", type:"yes" },
  { label:"3-4.5 hrs", detail:"Eligible for IV thrombolysis? Yes → Administer IV thrombolysis. No → Neurovascular studies.", type:"decision" },
  { label:"> 4.5 hrs", detail:"DW-MRI. Eligible? Yes → IV thrombolysis. No → Neurovascular studies.", type:"no" },
  { label:"Neurovascular studies", detail:"Eligible → Mechanical thrombectomy. Not eligible → Individual specialist management.", type:"action" }
]},
{ id:"a45", category:"MANAGEMENT", system:"Neurology", name:"TIA — Reversible Focal Neurological Symptoms", alt:"TIA Algorithm", desc:"ABCD² score-based TIA management.", steps:[
  { label:"Reversible focal neurological symptoms suggesting TIA", detail:"Symptoms resolved within 24 hours? Yes → Rule out differentials (hypoglycemia, hyponatremia, infections). +/- Determine etiology (AFib). Immediate ECG, POC glucose, labs. Neuroimaging: CT or MRI within 24 hours. Normal → Manage as TIA. Abnormal → Treat as acute stroke.", type:"action" },
  { label:"Manage as TIA", detail:"Risk stratify with ABCD² · Start antithrombotic therapy · Determine etiology with neurovascular and cardiac studies · Start long-term stroke prevention.", type:"action" },
  { label:"ABCD² score", detail:"Determine 2-day stroke risk. Symptom onset < 72 hours PLUS: Score ≥ 3 OR Score 0-2 + inability to complete outpatient work-up OR evidence of focal ischemia OR high-risk clinician judgement. Yes → Inpatient work-up. No → Outpatient work-up.", type:"action" },
  { label:"Antithrombotic therapy", detail:"Start within 24 hours. Low risk TIA: ABCD² 0-3 → Aspirin. Moderate-high risk: ABCD² ≥ 4 → Consider dual antiplatelet therapy for 21 days: Aspirin and clopidogrel.", type:"action" },
  { label:"Neurovascular and cardiac studies", detail:"Complete within 24 hours. Cardiac monitoring → Cardiology consult ± anticoagulation. Echocardiogram → Cardiology consult ± anticoagulation. CT/MRI angiography or carotid Doppler → Treat carotid stenosis (e.g., revascularization).", type:"action" },
  { label:"Long-term stroke prevention", detail:"BP control, statin therapy, smoking cessation, diabetes and obesity screening.", type:"terminal" }
]},
{ id:"a46", category:"MANAGEMENT", system:"Neurology", name:"Convulsive Seizure — Status Epilepticus", alt:"Status Epilepticus Algorithm", desc:"Time-based management of status epilepticus.", steps:[
  { label:"Convulsive seizure", detail:"Initial assessment.", type:"action" },
  { label:"Initial assessment", detail:"History of epilepsy? Stroke or cerebral infection? Known diabetes? Alcohol? Opiates? · Start stopwatch · ABCD (+ neuro exam) · Labs: electrolytes, glucose, toxicology, ABG, AED levels · Insert 2+ IV catheters · Monitoring + O₂.", type:"action" },
  { label:"Initiate supportive pharmacological therapy", detail:"Glucose, thiamine, naloxone, depending on suspected cause.", type:"action" },
  { label:"Seizure stops?", detail:"Yes → Further diagnostics. No → Status epilepticus (5-min seizure).", type:"decision" },
  { label:"Initial treatment phase (5-20 min)", detail:"Benzodiazepines: IV lorazepam OR IV diazepam OR IM midazolam. No IV: Rectal diazepam, buccal/intranasal lorazepam/midazolam.", type:"action" },
  { label:"Second treatment phase (20-40 min)", detail:"Non-BZD AEDs: IV fosphenytoin OR IV valproic acid OR IV levetiracetam OR IV phenobarbital.", type:"action" },
  { label:"Third treatment phase (40-60 min)", detail:"Anesthetic doses: Thiopental OR Propofol OR Midazolam OR Pentobarbital.", type:"action" },
  { label:"ICU admission", detail:"Monitoring · Intubation · Continuous EEG.", type:"terminal" }
]},
{ id:"a47", category:"DIAGNOSIS", system:"Obstetrics & Gynecology", name:"Diagnostic Approach to Palpable Breast Mass", alt:"Breast Mass Algorithm", desc:"Age-based diagnostic algorithm for palpable breast mass.", steps:[
  { label:"Palpable breast mass", detail:"Initial assessment.", type:"action" },
  { label:"Patient age", detail:"Decision point.", type:"decision" },
  { label:"< 30 years", detail:"High clinical suspicion? No → Observe for 1-2 months. Mass resolves → No further management. Mass persists → Ultrasound. Yes → Ultrasound.", type:"no" },
  { label:"≥ 30 years", detail:"Diagnostic mammography or DBT. Presence of clinical features of breast cancer OR imaging findings concerning for malignancy? No → Ultrasound. Yes → 30-39 years → Consider US before biopsy. ≥ 40 years → Core needle biopsy.", type:"yes" },
  { label:"Ultrasound findings", detail:"No abnormalities → High suspicion? No → Clinical surveillance 1-2 years. Yes → < 30 → Mammography then biopsy. ≥ 30 → Core needle biopsy. Breast cyst → Evaluate cyst characteristics. Solid mass → Concern for malignancy? No → Clinical surveillance. Yes → Core needle biopsy.", type:"action" }
]},
{ id:"a48", category:"RESUSCITATION", system:"Pediatrics", name:"Neonatal Resuscitation Algorithm", alt:"NRP Algorithm", desc:"Newborn resuscitation protocol.", steps:[
  { label:"Birth", detail:"Initial assessment.", type:"action" },
  { label:"Born at term? Good muscle tone? Breathing and/or crying without difficulty?", detail:"Yes to all → Standard postdelivery care. No to any → Initial resuscitation.", type:"decision" },
  { label:"Initial resuscitation", detail:"Dry with towel, clamp and cut cord · Radiant warmer · Clear secretions and position neck in slight extension · Stimulate by rubbing back and soles · Monitor breathing effort, tone, color, temperature.", type:"action" },
  { label:"Within first minute of birth", detail:"Apnea? Gasping? HR < 100 bpm? Yes → Initiate PPV, monitor. No → Labored breathing or persistent cyanosis but HR ≥ 100 bpm? Yes → Clear secretions, position neck, provide oxygen, consider CPAP, monitor.", type:"decision" },
  { label:"After 15 seconds: HR increase?", detail:"Yes → Continue PPV. No → Troubleshoot PPV.", type:"decision" },
  { label:"After 30 seconds: HR < 60 bpm?", detail:"Yes → Initiate chest compressions · Place advanced airway, provide 100% FiO₂ · Consider intravascular access.", type:"decision" },
  { label:"HR remains < 60 bpm despite adequate CPR", detail:"Administer epinephrine · Consider alternative causes of bradycardia.", type:"terminal" }
]},
{ id:"a49", category:"RESUSCITATION", system:"Pediatrics", name:"Pediatric Advanced Life Support (PALS)", alt:"PALS Algorithm", desc:"Pediatric cardiac arrest algorithm.", steps:[
  { label:"Unresponsive child", detail:"Abnormal or absent respirations, or no pulse.", type:"action" },
  { label:"Start CPR", detail:"15:2 for two rescuers prepubertal · 30:2 for two rescuers from puberty · 30:2 for single rescuer · Depth: 5 cm (children), 4 cm (infants) · Rate 100-120/min · Bag-mask 100% O₂ · Attach defibrillator.", type:"action" },
  { label:"Analyze rhythm", detail:"Decision point.", type:"decision" },
  { label:"Shockable rhythms", detail:"VF · Pulseless VT.", type:"yes" },
  { label:"Nonshockable rhythms", detail:"Asystole · PEA.", type:"no" },
  { label:"Shock as soon as possible", detail:"Initial: 2 J/kg · Second: 4 J/kg · Increase up to 10 J/kg or adult dose.", type:"action" },
  { label:"Epinephrine 0.01 mg/kg IV/IO", detail:"Max single dose 1 mg · Repeat every 3-5 minutes.", type:"action" },
  { label:"Resume CPR for 2 minutes", detail:"In parallel: consider advanced airway, IV/IO access, treat reversible causes.", type:"action" },
  { label:"Check for signs of ROSC", detail:"Palpable pulse · Measurable BP · Increase in EtCO₂.", type:"decision" },
  { label:"Resuscitation drugs for shockable rhythms", detail:"After 2nd: Epi 0.01 mg/kg · After 3rd: Amiodarone 5 mg/kg OR Lidocaine 1 mg/kg · After 4th: Epi · After 5th: Amiodarone 5 mg/kg OR Lidocaine 1 mg/kg.", type:"action" },
  { label:"Postresuscitation care", detail:"Signs of ROSC → Postresuscitation care.", type:"terminal" }
]},
{ id:"a50", category:"RESUSCITATION", system:"Pediatrics", name:"Pediatric BLS — ≥ 2 Rescuers", alt:"Pediatric BLS Algorithm", desc:"Two-rescuer pediatric basic life support.", steps:[
  { label:"Assess scene safety", detail:"Ensure safety.", type:"action" },
  { label:"Unresponsive child with absent or abnormal breathing", detail:"Confirm unresponsiveness.", type:"action" },
  { label:"Call for help", detail:"First rescuer: immediate CPR · Second rescuer: Activate EMS and retrieve AED.", type:"action" },
  { label:"Assess for signs of life", detail:"Basic airway maneuvers · Visible foreign body removal · Look, listen, feel · Central pulse check < 10 seconds.", type:"action" },
  { label:"Pulse present, normal breathing → Recovery position", detail:"Monitor.", type:"yes" },
  { label:"Pulse present, abnormal breathing → Manage respiratory failure", detail:"1 rescue breath every 2-3 seconds · Pulse check every 2 minutes · Naloxone for opioid overdose. HR ≤ 60 + poor perfusion? Yes → Start chest compressions. No → Continue rescue breaths.", type:"no" },
  { label:"Pulse absent, apnea, or agonal breathing → Start chest compressions", detail:"30:2 single, 15:2 ≥ 2 rescuers · Depth 5 cm (children), 4 cm (infants) · Rate 100-120/min · Attach AED while CPR continues · Change roles every 2 min.", type:"decision" },
  { label:"Pause CPR for rhythm analysis and pulse check", detail:"Shock advised → Deliver shock. Shock not advised → Immediately resume CPR for 2 minutes.", type:"action" },
  { label:"Endpoints", detail:"Arrival of PALS-trained providers · Clear signs of life · Rescuer too fatigued.", type:"terminal" }
]},
{ id:"a51", category:"RESUSCITATION", system:"Pediatrics", name:"Pediatric BLS — Single Rescuer", alt:"Single Rescuer BLS", desc:"Single-rescuer pediatric basic life support.", steps:[
  { label:"Assess scene safety", detail:"Ensure safety.", type:"action" },
  { label:"Unresponsive child with absent or abnormal breathing", detail:"Confirm unresponsiveness.", type:"action" },
  { label:"Call for help", detail:"Activate EMS before starting CPR.", type:"action" },
  { label:"Assess for signs of life", detail:"Basic airway maneuvers · Visible foreign body removal · Look, listen, feel · Central pulse check < 10 secs.", type:"action" },
  { label:"Pulse present, normal breathing → Recovery position", detail:"Monitor.", type:"yes" },
  { label:"Pulse present, abnormal breathing → Manage respiratory failure", detail:"1 rescue breath every 2-3 seconds · Pulse check every 2 minutes · Naloxone for opioid overdose. HR ≤ 60 + poor perfusion? Yes → Start chest compressions. No → Continue rescue breaths.", type:"no" },
  { label:"Pulse absent, apnea, or agonal breathing → Witnessed collapse?", detail:"Yes → Retrieve AED and use immediately. No → Start chest compressions.", type:"decision" },
  { label:"Start chest compressions", detail:"30:2 · Depth 5 cm (children), 4 cm (infants) · Rate 100-120/min · Naloxone for suspected opioid overdose · Use AED once available.", type:"action" },
  { label:"Still alone after 2 mins?", detail:"Yes → Activate EMS, retrieve and attach AED. No → Switch to 15:2. 2nd rescuer to attach AED while CPR continues.", type:"decision" },
  { label:"Pause CPR for rhythm analysis and pulse check", detail:"Shock advised → Deliver shock. Shock not advised → Immediately resume CPR for 2 mins.", type:"action" },
  { label:"Endpoints", detail:"Arrival of PALS-trained providers · Clear signs of life · Rescuer too fatigued.", type:"terminal" }
]},
{ id:"a52", category:"MANAGEMENT", system:"Pediatrics", name:"Bilious Vomiting in an Infant", alt:"Bilious Vomiting Algorithm", desc:"Imaging-based diagnosis of intestinal obstruction.", steps:[
  { label:"Bilious vomiting in an infant", detail:"Possible intestinal obstruction.", type:"action" },
  { label:"Initial management", detail:"NPO · NG or OG tube placement · IV fluids · Correct electrolyte abnormalities.", type:"action" },
  { label:"Hemodynamically unstable or signs of peritonitis?", detail:"Fever, guarding, rebound tenderness.", type:"decision" },
  { label:"Yes → IV antibiotics + emergency surgery", detail:"Resuscitate and operate.", type:"yes" },
  { label:"No → Abdominal X-ray", detail:"Decision point.", type:"no" },
  { label:"Pneumoperitoneum (Rigler sign)", detail:"Bowel perforation → IV antibiotics + emergency surgery.", type:"terminal" },
  { label:"Dilated loops of bowel", detail:"Contrast enema. Microcolon → Meconium ileus. Rectosigmoid transition zone → Hirschsprung disease.", type:"terminal" },
  { label:"'Double-bubble' sign", detail:"Duodenal atresia → Refer to duodenal atresia article.", type:"terminal" },
  { label:"NG tube in misplaced duodenum + right-sided jejunal markings + absent stool filled colon in RLQ", detail:"Upper GI contrast study. Abnormal duodenal junction + corkscrew appearance → Malrotation with midgut volvulus.", type:"terminal" },
  { label:"Pneumatosis, portal venous gas", detail:"Necrotizing enterocolitis → Refer to NEC article.", type:"terminal" }
]},
{ id:"a53", category:"MANAGEMENT", system:"Pediatrics", name:"Postresuscitation Care", alt:"Post-Cardiac Arrest Care", desc:"Post-resuscitation stabilization and management.", steps:[
  { label:"Postresuscitation care", detail:"Initial stabilization.", type:"action" },
  { label:"Manage airway, breathing, circulation", detail:"SpO₂ 90-98% · PaCO₂ 35-45 mm Hg · MAP > 65 mm Hg.", type:"action" },
  { label:"Obtain 12-lead ECG", detail:"Decision point.", type:"decision" },
  { label:"Acute ST elevation?", detail:"Yes → Urgent PCI. No → Continue postresuscitation care.", type:"yes" },
  { label:"Identify and treat underlying causes and complications", detail:"Consider POCUS, bedside ECHO, and/or whole-body CT.", type:"action" },
  { label:"Assess patient off sedation and neuromuscular blockade", detail:"Decision point.", type:"decision" },
  { label:"Unable to follow commands and/or myoclonus", detail:"Perform EEG. Seizure activity → Antiepileptic treatment. No seizure → Temperature control (32-37.5°C), Neuroprotective measures, Neuroprognostication.", type:"no" },
  { label:"Able to follow commands", detail:"Ongoing critical care as required.", type:"yes" }
]},
{ id:"a54", category:"MANAGEMENT", system:"Surgery", name:"Penetrating Abdominal Trauma", alt:"Abdominal Trauma Algorithm", desc:"ABCDE approach and surgical indications.", steps:[
  { label:"Penetrating abdominal trauma", detail:"Initial assessment.", type:"action" },
  { label:"Begin primary survey ABC(DE) approach", detail:"Airway → Intubate if indicated. Breathing → O₂ if indicated. Circulation → FAST. Resuscitation if indicated (CPR, IV fluids, vasopressors).", type:"action" },
  { label:"Continued hemodynamic instability", detail:"Consider diagnostic peritoneal lavage.", type:"no" },
  { label:"Penetrating object still in situ?", detail:"Decision point.", type:"decision" },
  { label:"No → Evisceration, peritonitis, rectal bleeding, bloody NG aspirate?", detail:"Yes → Emergency laparotomy. No → Additional diagnostics in stable patients (CT, MRI).", type:"no" },
  { label:"Indication for surgery?", detail:"Peritoneal penetration · Intraabdominal bleeding · Pneumoperitoneum · Severe organ injury. Yes → Surgery as needed. No → Conservative management.", type:"decision" },
  { label:"Consider tetanus prophylaxis and broad-spectrum antibiotic prophylaxis", detail:"Standard.", type:"terminal" }
]},
{ id:"a55", category:"MANAGEMENT", system:"Surgery", name:"Penetrating Thoracic Trauma", alt:"Thoracic Trauma Algorithm", desc:"ABCDE approach and surgical indications.", steps:[
  { label:"Penetrating thoracic trauma", detail:"Initial assessment.", type:"action" },
  { label:"Consider abdominal trauma", detail:"Penetrating wound below nipples.", type:"action" },
  { label:"Begin primary survey ABC(DE) approach", detail:"Airway → Intubate if indicated (not if tension pneumothorax or cardiac tamponade). Breathing → O₂ if indicated. Circulation → EFAST. Resuscitation.", type:"action" },
  { label:"Clinical signs of tension pneumothorax?", detail:"Absent breath sounds, hyperresonance, tracheal deviation, JVD.", type:"decision" },
  { label:"Yes → Needle thoracostomy, then chest tube", detail:"Immediate decompression.", type:"yes" },
  { label:"No → Oxygen if indicated", detail:"Continue assessment.", type:"no" },
  { label:"Cardiac tamponade, hemodynamic instability, or cardiac arrest?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Resuscitation", detail:"CPR, IV fluids, vasopressors. Current or impending arrest? Yes → Consider resuscitative (ED) thoracotomy. No → Consider emergency pericardiocentesis.", type:"yes" },
  { label:"No → Penetrating object still in situ?", detail:"Decision point.", type:"no" },
  { label:"No → Additional imaging in stable patients", detail:"CT chest, bronchoscopy, angiography.", type:"no" },
  { label:"Indication for surgery?", detail:"Diaphragmatic rupture · Extensive hemothorax · Severe organ injury. Yes → Urgent thoracotomy. No → Conservative management.", type:"decision" },
  { label:"Consider", detail:"Tetanus prophylaxis · Broad spectrum antibiotic prophylaxis · Chest tube if pneumothorax.", type:"terminal" }
]},
{ id:"a56", category:"MANAGEMENT", system:"Surgery", name:"Suspected Pneumothorax", alt:"Pneumothorax Algorithm", desc:"Stability-based management of pneumothorax.", steps:[
  { label:"Suspected pneumothorax", detail:"Initial assessment.", type:"action" },
  { label:"Trauma patient?", detail:"Yes → ATLS protocols. No → Respiratory support & pain control: Upright positioning, O₂, Analgesia.", type:"decision" },
  { label:"≥ 1 of the following?", detail:"RR ≥ 24/min · SpO₂ ≤ 90% · Speaking in incomplete sentences · HR < 60 or > 120/min · SBP < 90 mm Hg.", type:"decision" },
  { label:"Yes (Unstable) → Suspected tension pneumothorax?", detail:"Distended neck veins, pulsus paradoxus. Yes → Emergency chest tube; consider needle thoracostomy. No → STAT bedside US or portable CXR. Pneumothorax confirmed → Emergency chest tube. No signs → Consider other diagnoses.", type:"yes" },
  { label:"No (Stable) → Obtain imaging", detail:"CXR, lung US, chest CT. Bilateral → Chest tube. Signs of pneumothorax → Age > 50 + smoking, or lung disease? No → Primary spontaneous pneumothorax. Yes → Secondary spontaneous pneumothorax.", type:"no" },
  { label:"Primary spontaneous pneumothorax", detail:"All of: 18-50 yo, apex-to-cupula < 3 cm, mobilization without dyspnea? Yes → Conservative management. No → Consider needle aspiration. Unsuccessful → Chest tube. Post-procedure CXR.", type:"action" },
  { label:"Secondary spontaneous pneumothorax", detail:"Apex-to-cupula < 3 cm → Observe for 24 hr (Serial CXR). Progression → Chest tube. Apex-to-cupula ≥ 3 cm → Chest tube, ICU transfer, thoracic surgery consult.", type:"action" }
]},
{ id:"a57", category:"MANAGEMENT", system:"Surgery", name:"Sigmoid Volvulus", alt:"Sigmoid Volvulus Algorithm", desc:"Endoscopic detorsion and surgical management.", steps:[
  { label:"Sigmoid volvulus", detail:"Coffee bean sign on x-ray, whirl sign on CT.", type:"action" },
  { label:"Initial management", detail:"NPO · NG tube placement · IV fluids · Correct electrolytes.", type:"action" },
  { label:"Hemodynamically unstable or signs of peritonitis?", detail:"Fever, guarding, rebound tenderness.", type:"decision" },
  { label:"Yes → IV antibiotics + emergency surgery", detail:"Hartmann procedure preferred.", type:"yes" },
  { label:"No → Sigmoidoscopic detorsion", detail:"Decision point.", type:"no" },
  { label:"Successful detorsion?", detail:"Yes → Endoscopic signs of mucosal ischemia? No → Soft rectal tube placement + semi-elective surgery (within 72 hours). Sigmoid colectomy + primary anastomosis preferred. Yes → IV antibiotics + emergency surgery. No → IV antibiotics + emergency surgery.", type:"decision" }
]},
{ id:"a58", category:"MANAGEMENT", system:"Surgery", name:"Acute Gout Attack", alt:"Gout Algorithm", desc:"Monotherapy vs combination therapy for acute gout.", steps:[
  { label:"Acute gout attack", detail:"Initial management.", type:"action" },
  { label:"Rest and ice; continue any preexisting ULT", detail:"Supportive care.", type:"action" },
  { label:"Initiate pharmacotherapy within 24 hours of symptom onset", detail:"Early treatment improves outcomes.", type:"action" },
  { label:"Attack involving ≥ 4 joints, > 1 large joint OR severe pain?", detail:"Decision point.", type:"decision" },
  { label:"No → Monotherapy with any first-line agent", detail:"Choice depends on clinician and patient preference.", type:"no" },
  { label:"Yes → Combination therapy", detail:"Decision point.", type:"yes" },
  { label:"First-line agents", detail:"Systemic glucocorticoids (PO/IV): preferable if NSAIDs contraindicated. Intraarticular glucocorticoids: no systemic effects. NSAIDs: ↑ risk PUD and AKI. Colchicine: contraindicated in severe CKD.", type:"action" },
  { label:"Combination therapy", detail:"Either: NSAIDs PLUS Intraarticular glucocorticoids OR Colchicine PLUS any one (Intraarticular glucocorticoids, NSAIDs, Systemic glucocorticoids).", type:"action" },
  { label:"Second-line agents", detail:"IL-1 inhibitors, ACTH. In consultation with rheumatology if first-line agents not tolerated or contraindicated.", type:"terminal" }
]},
{ id:"a59", category:"MANAGEMENT", system:"Surgery", name:"Suspected Acute Pyelonephritis", alt:"Pyelonephritis Algorithm", desc:"Complicated vs uncomplicated management.", steps:[
  { label:"Suspected acute pyelonephritis", detail:"Fever, chills · Flank pain, CVA tenderness · Lower urinary tract symptoms.", type:"action" },
  { label:"Check vitals", detail:"Hemodynamic instability? Yes → Fluid resuscitation, admit to ICU, initiate sepsis workup. No → CBC, BMP, CRP, UA & urine culture.", type:"decision" },
  { label:"Uncomplicated pyelonephritis", detail:"Indications for initial imaging? (New eGFR ≤ 40, Known/suspected urolithiasis, Recurrent pyelonephritis). No → Persistent nausea/vomiting, hypovolemia, no suitable antibiotic, poor adherence. No → Outpatient management: PO antibiotics, Analgesia, Antiemetics, fluid intake.", type:"no" },
  { label:"Complicated pyelonephritis", detail:"Inpatient management: Blood cultures (2 sets), CT abdomen with & without contrast. IV fluids, IV empiric antibiotics, Analgesia, Antiemetics. Complications? Abscess → < 3 cm & no sepsis: Percutaneous drainage. ≥ 3 cm or sepsis: Urology/IR consult. Obstruction → Urology/IR consult. Life-threatening urosepsis → Urology/surgery consult for possible nephrectomy. Shock → ICU, Aggressive fluid resuscitation ± vasopressors.", type:"yes" },
  { label:"Adjust antibiotic therapy according to blood & urine culture sensitivities", detail:"Afebrile for 48 hr → Switch to PO antibiotics and follow-up outpatient. No clinical improvement within 48 hr → Repeat renal imaging or MRI.", type:"terminal" }
]},
{ id:"a60", category:"MANAGEMENT", system:"Surgery", name:"Features of Angioedema", alt:"Angioedema Algorithm", desc:"Histamine vs bradykinin-mediated angioedema.", steps:[
  { label:"Features of angioedema", detail:"Facial edema · Dyspnea, stridor · Urticaria.", type:"action" },
  { label:"Stop potential triggers, Assess ABC", detail:"Initial management.", type:"action" },
