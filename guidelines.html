  { label:"Signs of airway compromise?", detail:"Yes → Call for help with airway management. Secure airway early. Once stable → Known hereditary angioedema? No → Treat as histamine-mediated. Yes → Treat as bradykinin-mediated.", type:"decision" },
  { label:"Signs of anaphylaxis?", detail:"Yes → Give empiric IM epinephrine. If no improvement with repeated doses → Treat as bradykinin-mediated.", type:"decision" },
  { label:"Known hereditary angioedema?", detail:"No → Histamine-mediated: IV antihistamines, IV glucocorticoids. No improvement → Bradykinin-mediated. Improvement → Continue as histamine-mediated. Yes → Bradykinin-mediated: C1-INH concentrate, Kallikrein inhibitor, Bradykinin-B2 receptor antagonist, FFP. Improvement → Continue as bradykinin-mediated.", type:"decision" }
]},
{ id:"a61", category:"MANAGEMENT", system:"Surgery", name:"Appendicitis Suspected", alt:"Appendicitis Algorithm", desc:"Scoring system-based diagnosis and management.", steps:[
  { label:"Appendicitis suspected", detail:"Vague periumbilical pain → localized RLQ pain · McBurney point tenderness · Rovsing sign · Obturator/psoas sign.", type:"action" },
  { label:"Hemodynamic instability and/or peritonitis/perforation?", detail:"Yes → Stabilize, consider upright CXR/abdominal XR, emergency consult for exploratory laparotomy. No → Supportive care and routine labs: NPO, IV fluids, analgesics, antiemetics, antipyretics. CBC, CRP, BMP, UA. β-hCG.", type:"decision" },
  { label:"Assess likelihood of appendicitis", detail:"Clinical judgement and/or scoring systems (AIR, Alvarado, PAS).", type:"action" },
  { label:"Low likelihood (AIR ≤ 4, Alvarado ≤ 4, PAS ≤ 3)", detail:"Consider in patient < 60 yr → Appendicitis unlikely. Patient > 60 yr → Obtain imaging.", type:"no" },
  { label:"Moderate likelihood (AIR 5-8, Alvarado 5-6, PAS 4-6)", detail:"Obtain imaging. US vs CT depends on patient characteristics. CT abdomen with IV contrast OR Ultrasound abdomen.", type:"yes" },
  { label:"High likelihood (AIR ≥ 9, Alvarado ≥ 7, PAS ≥ 7)", detail:"Some institutions skip imaging if high pretest probability. → Empiric IV antibiotics.", type:"decision" },
  { label:"Imaging evidence of appendicitis?", detail:"No → Appendicitis unlikely. Inconclusive → Further assessment. Yes → Empiric IV antibiotics.", type:"action" },
  { label:"Surgical consult", detail:"Uncomplicated: Emergency appendectomy OR Delayed appendectomy within 24 hr OR Nonoperative management. Complicated: Gangrenous → Sealed perforation. Inflammatory mass/phlegmon → Abscess < 4 cm. Abscess ≥ 4 cm OR < 4 cm & not improved → Drainage (Percutaneous or surgical). Nonoperative management → Failure → Interval appendectomy (6-8 wk).", type:"terminal" }
]},
{ id:"a62", category:"MANAGEMENT", system:"Surgery", name:"Adult Patient with Acute Abdominal Pain", alt:"Acute Abdomen Algorithm", desc:"Hemodynamic stability-based approach to acute abdominal pain.", steps:[
  { label:"Adult patient with acute abdominal pain", detail:"Initial assessment.", type:"action" },
  { label:"SBP ≥ 90 mm Hg (Hemodynamically stable)", detail:"Routine imaging normal? Elevated lactate → CTA abdomen once stabilized. ↑ Lipase ≥ 3x ULN → Acute pancreatitis. Cholestasis → Acute cholangitis. Abnormal US: Dilated aorta → Ruptured AAA. Free fluid → Ruptured ectopic (bHcg > 1500, no IUP). Abnormal x-rays: Air under diaphragm → Bowel perforation. Dilated bowel loops → Bowel obstruction.", type:"yes" },
  { label:"SBP < 90 mm Hg (Hemodynamically unstable)", detail:"ABCDE assessment: A: Airway control. B: Monitor SpO₂ + O₂. C: Cardiac monitor, lactate, IV fluids. D: Identify source of instability. E: Focused H&P. Peritoneal signs → Upright CXR & surgery consult. Persistent instability → ICU consult.", type:"no" },
  { label:"Abdominal cause suspected", detail:"Rapid bedside testing: US abdomen/pelvis, X-rays AXR/Upright CXR, LFTs and Lipase.", type:"action" },
  { label:"Thoracic cause suspected", detail:"Rapid bedside testing: ECG, Cardiac markers, CXR.", type:"action" },
  { label:"Life-threatening conditions suspected", detail:"IV analgesia, Focused H&P, Labs and initial bedside testing, +/- CT abdomen. Life-threatening unlikely → Refer to 'Non-life-threatening' flowchart.", type:"terminal" }
]},
{ id:"a63", category:"MANAGEMENT", system:"Surgery", name:"Adult Patient with Abdominal Pain (Non-Life-Threatening)", alt:"Non-Emergent Abdominal Pain", desc:"Localized vs diffuse abdominal pain algorithm.", steps:[
  { label:"Adult patient with abdominal pain", detail:"Initial assessment.", type:"action" },
  { label:"Hemodynamic instability and/or peritoneal signs?", detail:"Yes → Refer to life-threatening causes flowchart. No → Is pain localized or diffuse?", type:"decision" },
  { label:"Localized", detail:"RUQ, LUQ, Epigastric, RLQ, LLQ.", type:"no" },
  { label:"Diffuse", detail:"Stable, nonspecific pain in young person without red flags? Yes → IBS, Gastroenteritis. No → Consider labs, abdominal XR, CT + IV contrast, colonoscopy → IBD, Celiac disease.", type:"yes" },
  { label:"RUQ", detail:"LFTs, amylase, lipase. Normal → RUQ US → Biliary colic, Cholecystitis. ↑ LFTs → Hepatitis panel & RUQ US. ↑ Amylase and lipase > 3x ULN → Acute pancreatitis.", type:"action" },
  { label:"LUQ", detail:"US, CT + IV contrast, CXR → Splenic pathology, Lower lobe pneumonia.", type:"action" },
  { label:"Epigastric", detail:"Amylase, lipase. Normal → GERD, Gastritis, PUD.", type:"action" },
  { label:"RLQ", detail:"US, CT + IV contrast, CTA. Consider in female sex/reproductive organs → Pelvic exam & pelvic US (+/- TVUS).", type:"action" },
  { label:"LLQ", detail:"US, CT + IV contrast, CTA.", type:"action" }
]},
{ id:"a64", category:"MANAGEMENT", system:"Surgery", name:"Cholelithiasis Symptoms", alt:"Cholelithiasis Algorithm", desc:"Risk-based management of suspected choledocholithiasis.", steps:[
  { label:"Symptoms of cholelithiasis", detail:"RUQ pain, biliary colic.", type:"action" },
  { label:"Right upper quadrant ultrasound", detail:"Cholelithiasis present? No → Consider alternate diagnosis. Yes → Assess predictors of concurrent choledocholithiasis.", type:"action" },
  { label:"Predictors of choledocholithiasis", detail:"Moderate: Abnormal LFTs, Age > 55, Clinical signs of gallstone pancreatitis. Strong: Dilated CBD > 6mm, Bilirubin 1.8-4 mg/dL. Very strong: CBD stone visualized, Clinical signs of acute cholangitis, Bilirubin > 4 mg/dL.", type:"action" },
  { label:"Determine risk of choledocholithiasis", detail:"Low (no predictors) → Cholecystectomy. Intermediate → Laparoscopy with US/cholangiography OR Pre-op EUS/MRCP. Stone in CBD → Pre-op ERCP. No stone → Cholecystectomy. High (1 very strong or 2 strong predictors) → Pre-op ERCP. Stone in CBD → Pre-op ERCP. No stone → Interval elective cholecystectomy.", type:"action" }
]},
{ id:"a65", category:"MANAGEMENT", system:"Surgery", name:"Symptoms of Hemorrhoids", alt:"Hemorrhoids Algorithm", desc:"External vs internal hemorrhoid management.", steps:[
  { label:"Symptoms of hemorrhoids", detail:"Bright red bleeding, pruritus.", type:"action" },
  { label:"Perianal inspection and digital rectal examination", detail:"Inconclusive → Anoscopy ± proctoscopy. Signs of malignancy → Flexible sigmoidoscopy, colonoscopy, or barium enema. Below dentate line (sometimes painful) → External hemorrhoids. Above dentate line (generally painless) → Internal hemorrhoids.", type:"action" },
  { label:"External hemorrhoids", detail:"Conservative: Lifestyle modifications, Stool softeners, Sitz baths. Persistent → Surgical: Arterial ligation, Hemorrhoidectomy, Hemorrhoidopexy.", type:"action" },
  { label:"Internal hemorrhoids", detail:"Not prolapsed (I), reduce at rest (II) → Conservative. Manually reducible (III) → Nonsurgical outpatient: Rubber band ligation, Sclerotherapy, Infrared coagulation. Irreducible prolapse, thrombosis (IV) → Surgical: Arterial ligation, Hemorrhoidectomy, Hemorrhoidopexy.", type:"action" }
]},
{ id:"a66", category:"MANAGEMENT", system:"Toxicology", name:"Foreign Body (FB) Aspiration", alt:"FB Aspiration Algorithm", desc:"Complete vs partial airway obstruction management.", steps:[
  { label:"Foreign body (FB) aspiration", detail:"Suspected or witnessed.", type:"action" },
  { label:"Signs of complete airway obstruction?", detail:"Inability to speak, cry, or cough · Inaudible breath sounds · Paradoxical chest/abdomen movement · Loss of consciousness, cyanosis.", type:"decision" },
  { label:"Yes → Complete airway obstruction", detail:"Responsive? No → Start CPR. Failure to dislodge → Emergency airway: Laryngoscopy-guided OR, Surgical airway. Yes → Back blows. Failure → Age group? Infant → Chest thrusts. Adults & children > 1 → Abdominal thrusts.", type:"yes" },
  { label:"No → Partial airway obstruction", detail:"Upper airway (Stridor, Sternal retraction, Accessory muscles, Difficulty swallowing, Drooling) → Neck X-ray. No FB → Laryngoscopy or nasal endoscopy. FB → Encourage coughing. Failure → Planned removal with laryngoscopy or nasal endoscopy. Lower airway (Cough, Absent breath sounds, Wheezing) → Chest X-ray. Yes → Encourage coughing. Failure → Planned removal with bronchoscopy. No → CT chest or bronchoscopy.", type:"no" }
]},
{ id:"a67", category:"MANAGEMENT", system:"Critical Care", name:"Mechanical Ventilation — Troubleshooting", alt:"Ventilator Troubleshooting", desc:"DOPE mnemonic-based troubleshooting for ventilated patients.", steps:[
  { label:"Respiratory distress in mechanically ventilated patient", detail:"Imminent cardiorespiratory collapse? Yes → Disconnect from ventilator & manually ventilate with 100% FiO₂. Review DOPE mnemonic. Relatively stable → Check alarms & monitors, check tubing & equipment, order tests.", type:"action" },
  { label:"DOPE mnemonic", detail:"Displacement/disconnection → Reconnect, laryngoscopy, reposition/reintubate. Obstruction → Reposition, suction, consider bite block. Pneumothorax → Chest tube. Equipment failure → Continue manual ventilation.", type:"action" },
  { label:"Increase FiO₂ to 100%", detail:"Focused H&P to determine cause.", type:"action" },
  { label:"Hemodynamic compromise", detail:"Treat underlying condition + optimize fluids and pressors. DHI present? No → Decrease PEEP as tolerated. Yes → Restart with: ↓ Vt/RR/I:E ratio, ↑ Inspiratory flow rate.", type:"action" },
  { label:"Dynamic hyperinflation (DHI)", detail:"Disconnect from ventilator; manually decompress chest.", type:"action" },
  { label:"Patient-ventilator dyssynchrony", detail:"Patient-related → Treat underlying disorder, optimize sedation. Ventilator-related → Expert consult, adjust mode/parameters.", type:"action" },
  { label:"Ventilation issue", detail:"Mandatory mode (AC-VCV) → Adjust minute ventilation. Spontaneous mode (PSV) → Treat underlying, add inspiratory support, reduce sedation, change to mandatory mode.", type:"action" },
  { label:"Oxygenation issue", detail:"Treat underlying reversible causes. Adjust FiO₂ and PEEP. Consider lung recruitment maneuvers.", type:"action" }
]},
{ id:"a68", category:"RESUSCITATION", system:"Critical Care", name:"Conditions Necessitating Mechanical Ventilation", alt:"Mechanical Ventilation Indications", desc:"Normal lung mechanics, hypoxemic, and hypercapnic respiratory failure.", steps:[
  { label:"Conditions necessitating mechanical ventilation", detail:"Decision point.", type:"decision" },
  { label:"Normal lung mechanics", detail:"Airway protection · Hemodynamic compromise. Prior to intubation: Optimize hemodynamics with fluids and vasopressor infusions · Consider pretreatment with push-dose vasopressors · Use induction agent with stable CV response (etomidate).", type:"yes" },
  { label:"Hypoxemic respiratory failure", detail:"Cardiogenic pulmonary edema → IV furosemide, IV nitroglycerin, rate control if Afib with RVR → Trial NIPPV → Inadequate response → Intubate. Pneumonia (without ARDS) → Consider NIPPV (limited evidence). ARDS → Consider NIPPV (only in mild cases) → Intubate.", type:"no" },
  { label:"Hypercapnic respiratory failure", detail:"Neuromuscular weakness and chest wall injury → Trial NIPPV → Inadequate response → Intubate. Acidosis (DKA, salicylate toxicity, AECOPD) → Consider trial NIPPV → Pretreatment with IV bicarbonate. Obstructive lung disease → Indications for urgent intubation? (Cardiac arrest, Respiratory arrest, Physical exhaustion, Altered mental status). Yes → Intubate. No → Maximize medical therapy → NIPPV → Inadequate response → Intubate.", type:"decision" },
  { label:"Intubate", detail:"Mode: AC-VCV/PCV/PRVC. Vt: 8-10 mL/kg, RR 10-15/min, FiO₂ 100% → < 40%, PEEP 3-5 cm H₂O. If ARDS → LPV: Vt 6-8 mL/kg, RR 20-35/min, PEEP 5 cm H₂O. Consider prone positioning, recruitment maneuvers, neuromuscular blockade.", type:"terminal" }
]},
{ id:"a69", category:"MANAGEMENT", system:"Dermatology", name:"Signs of Skin or Soft Tissue Infection", alt:"SSTI Algorithm", desc:"Nonpurulent vs purulent SSTI management.", steps:[
  { label:"Signs of skin or soft tissue infection", detail:"Redness, heat, swelling, pain, loss of function.", type:"action" },
  { label:"Signs of necrotizing infection?", detail:"Rapid deterioration or shock · Progressive infection with necrosis · Bullae · Purple skin discoloration. Yes → Emergency surgical debridement + cultures + sensitivities. Empiric IV antibiotics: Daptomycin, linezolid, or vancomycin PLUS A carbapenem, piperacillin/tazobactam, FQ + metronidazole, or ceftriaxone + metronidazole.", type:"decision" },
  { label:"Condition requires specialized tx?", detail:"Bite wound · Orbital cellulitis · Complex abscess · Device/prosthetics-related. Yes → Specialist consult.", type:"decision" },
  { label:"Nonpurulent vs Purulent infections", detail:"Determine severity: Exam, labs (CBC, BMP, CRP, calcitonin), ± imaging.", type:"decision" },
  { label:"Mild SSTI (Locally confined)", detail:"Oral antibiotics: Penicillin VK, cephalexin, dicloxacillin, or clindamycin. Incision + drainage usually sufficient. Consider topical antibiotics.", type:"no" },
  { label:"Moderate SSTI (Systemic symptoms)", detail:"IV antibiotics: Penicillin, ceftriaxone, cefazolin, or clindamycin. Incision + drainage with culture + sensitivity. Oral/IV antibiotics: TMP/SMX or doxycycline.", type:"yes" },
  { label:"Severe SSTI", detail:"SIRS · Features of deep tissue infection · Any necrotizing infection · Organ failure · Immunocompromised · Failed initial treatment. Surgical debridement with culture + sensitivity. IV antibiotics: Vancomycin PLUS pip/tazo or meropenem. Incision + drainage with culture + sensitivity. IV: Vancomycin, daptomycin, linezolid, telavancin, or ceftaroline.", type:"decision" },
  { label:"Adapt antibiotic treatment to culture and sensitivity results", detail:"Evaluate and treat risk factors to prevent recurrent infection.", type:"terminal" }
]},
{ id:"a70", category:"DIAGNOSIS", system:"Hematology", name:"Suspected Hypercalcemia", alt:"Hypercalcemia Algorithm", desc:"PTH and PTHrP-based differentiation of hypercalcemia.", steps:[
  { label:"↑ Serum calcium (incidental finding or suspected hypercalcemia)", detail:"Confirm hypercalcemia.", type:"action" },
  { label:"Order ionized Ca²⁺ or calculate Ca²⁺ corrected for serum albumin", detail:"Decision point.", type:"decision" },
  { label:"Normal Ca²⁺ → Remeasure after discontinuing interfering medications", detail:"Repeat testing.", type:"no" },
  { label:"↑ Ca²⁺ → Confirmed hypercalcemia", detail:"Check PTH.", type:"yes" },
  { label:"↑ PTH (+ ↓ Phosphate) → Primary hyperparathyroidism", detail:"Parathyroidectomy if indicated.", type:"yes" },
  { label:"↔/↑ PTH → Urine Ca²⁺", detail:"Decision point.", type:"decision" },
  { label:"↔/↑ Ca²⁺ → Familial hypocalciuric hypercalcemia", detail:"Usually no treatment needed.", type:"yes" },
  { label:"↓ Ca²⁺ → Hypercalcemia of malignancy", detail:"Treat underlying malignancy.", type:"no" },
  { label:"↓ PTH → PTHrP, Calcidiol and Calcitriol", detail:"Decision point.", type:"no" },
  { label:"↑ PTHrP → Hypercalcemia of malignancy", detail:"Treat underlying malignancy.", type:"yes" },
  { label:"↑ Calcitriol → Granulomatous diseases (sarcoidosis) or lymphoma", detail:"Treat underlying disease.", type:"decision" },
  { label:"↑ Calcidiol → Vitamin D intoxication", detail:"Stop vitamin D.", type:"terminal" },
  { label:"Vit. D metabolites, ↔ PTHrP → Consider other causes", detail:"Further workup.", type:"terminal" }
]},
{ id:"a71", category:"DIAGNOSIS", system:"Endocrine", name:"Diagnosis of Hypocalcemia", alt:"Hypocalcemia Algorithm", desc:"PTH-based differentiation of hypocalcemia causes.", steps:[
  { label:"Serum calcium < 8.5 mg/dL", detail:"Confirm hypocalcemia.", type:"action" },
  { label:"Either: Order ionized Ca²⁺ or Calculate Ca²⁺ corrected for albumin", detail:"Decision point.", type:"decision" },
  { label:"Normal Ca²⁺ → Factitious hypocalcemia", detail:"No treatment needed.", type:"no" },
  { label:"↓ Ca²⁺ → Confirmed hypocalcemia", detail:"Discontinue any medications that can cause hypocalcemia.", type:"yes" },
  { label:"Measure PTH", detail:"Decision point.", type:"decision" },
  { label:"Normal or ↓ PTH → Hypoparathyroidism", detail:"Treat with calcium and vitamin D.", type:"no" },
  { label:"↑ PTH → Measure phosphate, magnesium, calcidiol, and creatinine", detail:"Decision point.", type:"yes" },
  { label:"↓ Or normal phosphate + ↓ Calcidiol → Vitamin D deficiency", detail:"Treat with vitamin D.", type:"no" },
  { label:"↑ Phosphate + ↑ Creatinine → Chronic kidney disease", detail:"Treat CKD.", type:"yes" },
  { label:"↑ Phosphate → Pseudohypoparathyroidism", detail:"Treat with calcium and vitamin D.", type:"decision" },
  { label:"↓ Magnesium → Either: Malabsorption · Alcohol use disorder", detail:"Correct magnesium.", type:"terminal" }
]},
{ id:"a72", category:"ACID_BASE", system:"Nephrology", name:"Acid-Base Disorder Evaluation Algorithm", alt:"Acid-Base Algorithm", desc:"pH and PCO₂/HCO₃⁻ based diagnosis of acid-base disorders.", steps:[
  { label:"Evaluate pH", detail:"Decision point.", type:"decision" },
  { label:"< 7.35 → Acidosis", detail:"Assess PCO₂ and HCO₃⁻.", type:"no" },
  { label:"> 7.45 → Alkalosis", detail:"Assess PCO₂ and HCO₃⁻.", type:"yes" },
  { label:"↑ PCO₂ → Respiratory acidosis", detail:"Metabolic compensation (↑ HCO₃⁻).", type:"no" },
  { label:"↓ HCO₃⁻ → Metabolic acidosis", detail:"Respiratory compensation (↓ PCO₂).", type:"yes" },
  { label:"↓ PCO₂ → Respiratory alkalosis", detail:"Metabolic compensation (↓ HCO₃⁻).", type:"no" },
  { label:"↑ HCO₃⁻ → Metabolic alkalosis", detail:"Respiratory compensation (↑ PCO₂).", type:"yes" },
  { label:"Calculate anion gap", detail:"Decision point.", type:"decision" },
  { label:"↑ Anion gap → High anion gap metabolic acidosis", detail:"MUDPILES: Methanol, Uremia, DKA, Paraldehyde, INH, Lactate, Ethylene glycol, Salicylates.", type:"yes" },
  { label:"Normal anion gap → Normal anion gap metabolic acidosis", detail:"FUSEDCARS: Fistula, Ureteroenterostomy, Saline infusion, Endocrine (Addison's, hyperparathyroidism), Diarrhea, Carbonic anhydrase inhibitors, Ammonium chloride, Renal tubular acidosis, Spironolactone.", type:"no" }
]},
{ id:"a73", category:"MANAGEMENT", system:"Pediatrics", name:"Bilious Vomiting in an Infant", alt:"Bilious Vomiting Algorithm", desc:"Imaging-based diagnosis of intestinal obstruction.", steps:[
  { label:"Bilious vomiting in an infant", detail:"Possible intestinal obstruction.", type:"action" },
  { label:"Initial management", detail:"NPO · NG or OG tube placement · IV fluids · Correct electrolytes.", type:"action" },
  { label:"Hemodynamically unstable or signs of peritonitis?", detail:"Fever, guarding, rebound tenderness.", type:"decision" },
  { label:"Yes → IV antibiotics + emergency surgery", detail:"Resuscitate and operate.", type:"yes" },
  { label:"No → Abdominal X-ray", detail:"Decision point.", type:"no" },
  { label:"Pneumoperitoneum (Rigler sign)", detail:"Bowel perforation → IV antibiotics + emergency surgery.", type:"terminal" },
  { label:"Dilated loops of bowel", detail:"Contrast enema. Microcolon → Meconium ileus. Rectosigmoid transition zone → Hirschsprung disease.", type:"terminal" },
  { label:"'Double-bubble' sign", detail:"Duodenal atresia → Refer to duodenal atresia article.", type:"terminal" },
  { label:"NG tube misplaced + right-sided jejunal markings + absent stool in RLQ", detail:"Upper GI contrast study. Abnormal duodenal junction + corkscrew appearance → Malrotation with midgut volvulus.", type:"terminal" },
  { label:"Pneumatosis, portal venous gas", detail:"Necrotizing enterocolitis → Refer to NEC article.", type:"terminal" }
]},
{ id:"a74", category:"MANAGEMENT", system:"Pediatrics", name:"Postresuscitation Care", alt:"Post-Cardiac Arrest Care", desc:"Post-resuscitation stabilization and management.", steps:[
  { label:"Postresuscitation care", detail:"Initial stabilization.", type:"action" },
  { label:"Manage airway, breathing, circulation", detail:"Target parameters: SpO₂ 90-98% · PaCO₂ 35-45 mm Hg · MAP > 65 mm Hg.", type:"action" },
  { label:"Obtain 12-lead ECG", detail:"Decision point.", type:"decision" },
  { label:"Acute ST elevation?", detail:"Yes → Urgent PCI. No → Continue postresuscitation care.", type:"yes" },
  { label:"Identify and treat underlying causes and complications", detail:"Consider POCUS, bedside ECHO, and/or whole-body CT.", type:"action" },
  { label:"Assess patient off sedation and neuromuscular blockade", detail:"Decision point.", type:"decision" },
  { label:"Unable to follow commands and/or myoclonus", detail:"Perform EEG. Seizure activity → Consider antiepileptic treatment. No seizure → Ongoing critical care: Temperature control (32-37.5°C), Neuroprotective measures, Neuroprognostication.", type:"no" },
  { label:"Able to follow commands", detail:"Ongoing critical care as required. E.g., PCI before hospital discharge.", type:"yes" }
]},
{ id:"a75", category:"MANAGEMENT", system:"Infectious Disease", name:"Treatment of Community-Acquired Pneumonia (CAP)", alt:"CAP Algorithm", desc:"PSI/CURB-65 based outpatient vs inpatient management.", steps:[
  { label:"Treatment of community-acquired pneumonia (CAP)", detail:"Calculate PSI or CURB-65 score to assess need for hospitalization.", type:"action" },
  { label:"PSI ≤ 70, CURB-65 ≤ 1 → Outpatient treatment", detail:"Comorbidities or risk factors for resistant pathogens? No → Monotherapy: Amoxicillin, Doxycycline, Macrolide. Yes → Combination therapy: β-lactam + macrolide OR respiratory fluoroquinolone.", type:"yes" },
  { label:"PSI > 90, CURB-65 ≥ 2 → Inpatient treatment", detail:"Suspected pseudomonas? Yes → Antipseudomonal β-lactam IV. No → Hypotension OR respiratory failure? No → Severe CAP criteria? No → Non-ICU: β-lactam IV + Azithro/Clarithro/Doxy. Yes → ICU. Yes → ICU.", type:"no" },
  { label:"Suspected MRSA involvement?", detail:"Previous MRSA in sputum, severe CAP with recent hospitalization, IV antibiotics in past 90 days. Yes → Add anti-MRSA therapy: Vancomycin IV or linezolid PO.", type:"decision" }
]},
{ id:"a76", category:"DIAGNOSIS", system:"Infectious Disease", name:"Serological Testing Algorithm for Syphilis", alt:"Syphilis Serology Algorithm", desc:"Standard vs reverse algorithm for syphilis testing.", steps:[
  { label:"Either: Features of syphilis · Candidate for screening", detail:"Choice depends on local laboratory.", type:"action" },
  { label:"Standard algorithm", detail:"First test: NTT. Positive → TT. Negative → Assess risk status.", type:"no" },
  { label:"Reverse algorithm", detail:"First test: TT. Negative → Assess risk status. Positive → NTT. Negative → Perform different TT. Positive → Current or past syphilis likely.", type:"yes" },
  { label:"Assess risk status", detail:"Low → Syphilis unlikely, no further testing. High → Early primary syphilis cannot be excluded. Presumptive treatment, retest after 2-4 weeks.", type:"decision" },
  { label:"Current or past syphilis likely", detail:"Positive NTT and TT. Treat as syphilis.", type:"terminal" },
  { label:"First test likely false positive", detail:"Negative NTT and TT. Repeat testing after 2-4 weeks in patients with risk factors.", type:"terminal" }
]},
{ id:"a77", category:"MANAGEMENT", system:"Infectious Disease", name:"Management of Lyme Disease", alt:"Lyme Disease Algorithm", desc:"Erythema migrans and serology-based management.", steps:[
  { label:"Confirmed or possible tick bite", detail:"Initial assessment.", type:"action" },
  { label:"Erythema migrans?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Antibiotic treatment", detail:"Doxycycline, amoxicillin, or cefuroxime.", type:"yes" },
  { label:"No → Symptoms of early or late disseminated Lyme disease?", detail:"Decision point.", type:"no" },
  { label:"Yes → Serological testing", detail:"Positive → Antibiotic treatment. Negative → Consider other causes.", type:"yes" },
  { label:"No → Criteria met for Lyme disease PEP?", detail:"Decision point.", type:"no" },
  { label:"Yes → PEP for Lyme disease", detail:"Single dose of doxycycline 200 mg.", type:"yes" },
  { label:"No → Lyme disease unlikely", detail:"No treatment needed.", type:"no" }
]},
{ id:"a78", category:"MANAGEMENT", system:"Infectious Disease", name:"Pharmacotherapy for the Agitated or Violent Patient", alt:"Agitation Algorithm", desc:"Etiology-based pharmacotherapy for agitation.", steps:[
  { label:"Medications for agitation indicated", detail:"Patient is a clear danger to self or other and unresponsive to nonpharmacological methods.", type:"action" },
  { label:"Treat critical or easily reversible causes first or concurrently", detail:"Hypoxia, shock, hypoglycemia, pain, seizure, acute urinary retention.", type:"action" },
  { label:"Very severe agitation or violent behavior?", detail:"Decision point.", type:"decision" },
  { label:"Yes → Consider: Antipsychotics PLUS benzodiazepines · Ketamine", detail:"Rapid tranquilization.", type:"yes" },
  { label:"No → Etiology-based treatment", detail:"Delirium or psychotic disorder → Antipsychotics PLUS BZDs · Ketamine. Unknown history → Psychosis? Yes → 2nd-gen antipsychotic (olanzapine, risperidone). No → Benzodiazepine (lorazepam, midazolam). CNS stimulant intoxication or depressant withdrawal → Benzodiazepine. CNS depressant intoxication → 1st-gen antipsychotic (haloperidol).", type:"no" },
  { label:"Safe approach to pharmacotherapy", detail:"Start at lowest possible dose (reduce for older adults) · Monitor for oversedation, hemodynamic instability, respiratory compromise · Repeat only if necessary.", type:"action" },
  { label:"Refractory agitation?", detail:"Yes → Reassess and consider alternative agents. No → Discontinue medication as soon as possible.", type:"decision" }
]},
{ id:"a79", category:"DIAGNOSIS", system:"Endocrine", name:"Suspected Adrenal Insufficiency (AI)", alt:"Adrenal Insufficiency Algorithm", desc:"Cortisol and ACTH-based diagnosis of adrenal insufficiency.", steps:[
  { label:"Suspected adrenal insufficiency (AI)", detail:"Fatigue, weakness, hyperpigmentation, salt and/or sugar craving.", type:"action" },
  { label:"Signs of adrenal crisis?", detail:"Refractory hypotension, impaired consciousness, severe abdominal pain, vomiting.", type:"decision" },
  { label:"Yes → Start empiric management", detail:"Hydrocortisone 100 mg IV · Fluid resuscitation · Treat hypoglycemia · Defer testing until stable.", type:"yes" },
  { label:"No → Measure morning cortisol", detail:"Decision point.", type:"no" },
  { label:"Low cortisol → Obtain morning ACTH and perform ACTH stimulation test", detail:"Measure cortisol rise.", type:"no" },
  { label:"High cortisol (≥ 18 mcg/dL) → Consider alternative diagnoses", detail:"Rule out other causes.", type:"yes" },
  { label:"↑ ACTH → Primary AI", detail:"High morning ACTH PLUS no rise after stimulation. Level of defect: adrenal glands. Screen for hypoaldosteronism and hypoandrogenism. Measure 21-hydroxylase antibodies. Negative → Consider other causes. Positive → Autoimmune AI: screen for autoimmune polyendocrine syndrome.", type:"yes" },
  { label:"↓ ACTH → Secondary or tertiary AI", detail:"Low morning ACTH PLUS significant rise after stimulation. Level of defect: pituitary (secondary) or hypothalamus (tertiary). MRI pituitary. Lesion detected → Treat. No lesion → Consider other causes.", type:"no" }
]},
{ id:"a80", category:"DIAGNOSIS", system:"Endocrine", name:"Evaluation of Hyperthyroidism", alt:"Hyperthyroidism Algorithm", desc:"TSH, free T4, and T3 based diagnosis of hyperthyroidism.", steps:[
  { label:"Hyperthyroidism suspected", detail:"Measure TSH, free T4, and total T3 levels.", type:"action" },
  { label:"↑ Or normal TSH + ↑ Free T4 + ↑ Total T3", detail:"Thyrotropic adenoma likely. MRI pituitary gland.", type:"yes" },
  { label:"↓ TSH + ↑ Free T4 + ↑ Total T3", detail:"Overt hyperthyroidism.", type:"no" },
  { label:"↓ TSH + Normal free T4 + Normal total T3", detail:"Measure β-hCG. Negative → Subclinical hyperthyroidism. Positive → Consider β-hCG-associated hyperthyroidism.", type:"decision" },
  { label:"Normal TSH + Normal free T4 + Normal total T3", detail:"Hyperthyroidism unlikely.", type:"terminal" },
  { label:"Diagnostic criteria met for Graves disease?", detail:"Decision point.", type:"decision" },
  { label:"Yes → High suspicion for Graves?", detail:"Check TRAb. Positive → Graves disease. Negative → Thyroid imaging.", type:"yes" },
  { label:"No → Thyroid imaging", detail:"Nuclear medicine thyroid scan · Radioactive iodine uptake · If unavailable, consider ultrasound with Doppler.", type:"no" },
  { label:"High uptake", detail:"Diffuse pattern → Graves. Nodular: One or two areas → Toxic adenoma. Multiple areas → Toxic multinodular goiter.", type:"yes" },
  { label:"Low uptake", detail:"Check anti-TPOAb and/or anti-TGAb. Positive → Hashitoxicosis. Negative → Measure thyroglobulin. High or normal → Endogenous hyperthyroidism. Low → Exogenous hyperthyroidism.", type:"no" }
]},
{ id:"a81", category:"DIAGNOSIS", system:"Endocrine", name:"Evaluation of Thyroid Nodule", alt:"Thyroid Nodule Algorithm", desc:"TSH, scintigraphy, and FNA-based evaluation.", steps:[
  { label:"Thyroid nodule", detail:"Initial evaluation: History and physical examination · TSH · Ultrasound of the neck.", type:"action" },
  { label:"TSH low", detail:"Thyroid scintigraphy. Hot nodule → Evaluate for hyperthyroidism. Cold nodule → Indications for fine needle aspiration?", type:"no" },
  { label:"TSH normal or elevated", detail:"Indications for fine needle aspiration?", type:"yes" },
  { label:"Indications for FNA?", detail:"Yes → Fine needle aspiration → Cytology. No → Monitor with thyroid ultrasound.", type:"decision" }
]},
{ id:"a82", category:"MANAGEMENT", system:"Gastroenterology", name:"Suspected GERD", alt:"GERD Algorithm", desc:"Symptom-based evaluation of GERD.", steps:[
  { label:"Suspected GERD", detail:"Either: Atypical symptoms · Typical symptoms · Extraesophageal symptoms.", type:"action" },
  { label:"Chest pain?", detail:"Yes → Exclude cardiac cause (ECG, troponin). No → Alarm symptoms? (Dysphagia, odynophagia, early satiety, anemia, GI bleed, persistent vomiting, unintentional weight loss, aspiration pneumonia).", type:"decision" },
  { label:"Alarm symptoms?", detail:"Yes → Upper GI endoscopy. No → High risk for Barrett esophagus? (Male, European descent, age ≥ 50, obese, symptoms ≥ 5 years).", type:"decision" },
  { label:"High risk for Barrett esophagus?", detail:"Yes → Upper GI endoscopy. No → Empiric therapy: PPI for 8 weeks + Lifestyle modifications.", type:"decision" },
  { label:"Empiric therapy response", detail:"Improvement → Assumed GERD. No response → Consider further diagnostic evaluation. Partial → Optimize PPI therapy.", type:"action" },
  { label:"Upper GI endoscopy", detail:"Normal → Esophageal pH monitoring (if suspected NERD). Abnormal → NERD or ERD.", type:"action" },
  { label:"Esophageal pH monitoring", detail:"Abnormal pH → NERD or ERD. Normal pH → Consider further diagnostic evaluation.", type:"action" }
]},
{ id:"a83", category:"ACID_BASE", system:"Nephrology", name:"Acid-Base Disorder Evaluation Algorithm", alt:"Acid-Base Algorithm", desc:"pH and PCO₂/HCO₃⁻ based diagnosis of acid-base disorders.", steps:[
  { label:"Evaluate pH", detail:"Decision point.", type:"decision" },
  { label:"< 7.35 → Acidosis", detail:"Assess PCO₂ and HCO₃⁻.", type:"no" },
  { label:"> 7.45 → Alkalosis", detail:"Assess PCO₂ and HCO₃⁻.", type:"yes" },
  { label:"↑ PCO₂ → Respiratory acidosis", detail:"Metabolic compensation (↑ HCO₃⁻).", type:"no" },
  { label:"↓ HCO₃⁻ → Metabolic acidosis", detail:"Respiratory compensation (↓ PCO₂).", type:"yes" },
  { label:"↓ PCO₂ → Respiratory alkalosis", detail:"Metabolic compensation (↓ HCO₃⁻).", type:"no" },
  { label:"↑ HCO₃⁻ → Metabolic alkalosis", detail:"Respiratory compensation (↑ PCO₂).", type:"yes" },
  { label:"Calculate anion gap", detail:"Decision point.", type:"decision" },
  { label:"↑ Anion gap → HAGMA", detail:"MUDPILES: Methanol, Uremia, DKA, Paraldehyde, INH, Lactate, Ethylene glycol, Salicylates.", type:"yes" },
  { label:"Normal anion gap → NAGMA", detail:"FUSEDCARS: Fistula, Ureteroenterostomy, Saline infusion, Endocrine, Diarrhea, Carbonic anhydrase inhibitors, Ammonium chloride, RTA, Spironolactone.", type:"no" }
]},
{ id:"a84", category:"MANAGEMENT", system:"Nephrology", name:"Management of Hypokalemia", alt:"Hypokalemia Algorithm", desc:"Severity-based management of hypokalemia.", steps:[
  { label:"Serum potassium < 3.5 mEq/L", detail:"Confirm hypokalemia.", type:"action" },
  { label:"Initial evaluation", detail:"BMP including calcium · Serum magnesium, phosphate · ABG or VBG · ECG · Consider measuring urinary potassium.", type:"action" },
  { label:"Symptomatic hypokalemia?", detail:"Decision point.", type:"decision" },
  { label:"Yes → IV potassium chloride PLUS oral repletion if tolerated", detail:"Continuous cardiac monitoring · Repeat K+ every 2-4 hours · Consider ICU admission.", type:"yes" },
  { label:"No → Assess severity", detail:"Decision point.", type:"no" },
  { label:"Mild (3.0-3.4)", detail:"Consider oral potassium chloride.", type:"no" },
  { label:"Moderate (2.5-2.9)", detail:"Oral potassium chloride repletion.", type:"yes" },
  { label:"Severe (< 2.5) and/or high risk of recurrent severe hypokalemia", detail:"IV potassium chloride PLUS oral repletion if tolerated.", type:"decision" },
  { label:"Further management", detail:"Assess and treat underlying cause · Specialist consult · Correct cautiously in impaired renal function.", type:"terminal" }
]},
{ id:"a85", category:"DIAGNOSIS", system:"Nephrology", name:"Diagnosis of Hypernatremia", alt:"Hypernatremia Algorithm", desc:"Volume status and urine osmolality based diagnosis.", steps:[
  { label:"Serum sodium > 145 mEq/L", detail:"Confirm hypernatremia.", type:"action" },
  { label:"Clinical evaluation to determine etiology", detail:"Decision point.", type:"decision" },
  { label:"Etiology clear", detail:"Treat underlying cause.", type:"yes" },
  { label:"Features of Cushing syndrome or primary hyperaldosteronism", detail:"Treat underlying cause.", type:"no" },
  { label:"Etiology unclear → Check urine osmolality", detail:"Decision point.", type:"decision" },
  { label:"> 600 mOsmol/kg → Implies extrarenal mechanism", detail:"Assess volume status.", type:"yes" },
  { label:"≤ 600 mOsmol/kg → Implies renal mechanism", detail:"Assess volume status.", type:"no" },
  { label:"Hypovolemic (extrarenal)", detail:"GI or skin loss.", type:"no" },
  { label:"Euvolemic (extrarenal)", detail:"Impaired thirst or lack of access to water.", type:"yes" },
  { label:"Hypervolemic (extrarenal)", detail:"Iatrogenic or ingestion.", type:"decision" },
  { label:"Hypovolemic (renal)", detail:"Diuretics or osmotic diuresis.", type:"no" },
  { label:"Euvolemic (renal)", detail:"Arginine vasopressin disorders.", type:"yes" },
  { label:"Hypervolemic (renal)", detail:"Either: Primary hyperaldosteronism · Cushing syndrome.", type:"decision" }
]},
{ id:"a86", category:"DIAGNOSIS", system:"Endocrine", name:"Suspected Arginine Vasopressin Disorder", alt:"Diabetes Insipidus Algorithm", desc:"Water deprivation test and copeptin-based diagnosis.", steps:[
  { label:"Suspected AVP disorder", detail:"Initial evaluation.", type:"action" },
  { label:"Initial evaluation", detail:"Plasma osmolality (POsm), BMP · Urinalysis · 24-hour urine collection: volume and UOsm.", type:"action" },
  { label:"High serum Na⁺ and/or POsm + Low UOsm → AVP disorder likely", detail:"Proceed to water deprivation test or plasma copeptin testing.", type:"yes" },
  { label:"Normal serum Na⁺ and POsm + Low UOsm → Diagnosis unclear", detail:"Proceed to water deprivation test or plasma copeptin testing.", type:"no" },
  { label:"Low serum Na⁺ and/or POsm + Very low UOsm → Primary polydipsia likely", detail:"Proceed to water deprivation test or plasma copeptin testing.", type:"decision" },
  { label:"Water deprivation test", detail:"POsm increases further, UOsm remains low.", type:"action" },
  { label:"UOsm < 300 → Administer desmopressin", detail:"No or minimal ↑ UOsm → AVP resistance. Significant ↑ → Complete AVP deficiency.", type:"no" },
  { label:"UOsm 300-800 → Administer desmopressin", detail:"Significant ↑ → Partial AVP deficiency. No or minimal ↑ → Primary polydipsia.", type:"yes" },
  { label:"Plasma copeptin testing", detail:"POsm and UOsm increase to normal level → Primary polydipsia.", type:"action" }
]},
{ id:"a87", category:"DIAGNOSIS", system:"Cardiovascular", name:"Acute Chest Pain — Life-Threatening Causes", alt:"Adult Chest Pain Algorithm", desc:"ABCDE assessment and differentiation of life-threatening chest pain.", steps:[
  { label:"Acute chest pain in an adult patient", detail:"Initial assessment.", type:"action" },
  { label:"ABCDE assessment", detail:"Airway, Breathing, Circulation, Disability, Exposure.", type:"action" },
  { label:"12-lead ECG", detail:"Decision point.", type:"decision" },
  { label:"ST elevations present → STEMI", detail:"Cardiology consult · Immediate revascularization · ASA + ADP receptor inhibitor · Anticoagulation, statin.", type:"yes" },
  { label:"No ST elevations present", detail:"Obtain IV access · Monitor cardiac rhythm, BP, SpO₂ · Supplemental O₂ if hypoxemic.", type:"no" },
  { label:"Focused history, physical exam, labs, CXR", detail:"Decision point.", type:"decision" },
  { label:"No life-threatening causes identified", detail:"Consider alternate diagnoses.", type:"terminal" },
  { label:"↑ Troponin + cardiac chest pain + CAD risk factors → NSTEMI", detail:"Cardiology consult and risk stratification (TIMI) · ASA + ADP receptor inhibitor · Anticoagulation, statin.", type:"yes" },
  { label:"Normal troponin + cardiac chest pain at rest + CAD risk factors → Unstable angina", detail:"Cardiology consult and risk stratification · ASA + ADP receptor inhibitor · Anticoagulation, statin.", type:"yes" },
  { label:"Mediastinal shift + absent lung markings → Tension pneumothorax", detail:"Needle decompression · Chest tube · Supplemental O₂.", type:"yes" },
  { label:"Prominent cardiac silhouette + JVD + muffled heart sounds → Cardiac tamponade", detail:"Bedside TTE · Needle decompression · Cardiology consult.", type:"yes" },
  { label:"Widened mediastinum + HTN → Aortic dissection", detail:"CTA chest · BP management · Cardiothoracic surgery consult.", type:"yes" },

// ============================================================
// STATE + PERSISTENCE
// ============================================================
const STORAGE_KEY = 'diagnostic_algorithms_v1';
const HILITE_KEY = 'diagnostic_algorithms_highlights';
const BOOKMARK_KEY = 'diagnostic_algorithms_bookmarks';
const VIEWMODE_KEY = 'diagnostic_algorithms_viewmode';

let algorithms = [];
let highlights = {};
let activeCategory = 'ALL';
let activeSystem = 'All';
let searchQuery = '';
let isTestMode = false;
let isHighlightMode = false;
let isFlipView = false;
let bookmarkedIds = [];
let renderLimit = 300;
const PAGE_SIZE = 60;

function loadData(){
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) { try { algorithms = JSON.parse(saved); return; } catch(e){ } }
  algorithms = ALGORITHMS.map(a => ({...a}));
  saveData();
}
function saveData(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(algorithms)); } catch(e){ showToast('⚠️ Storage full'); } }
function loadHighlights(){ try { highlights = JSON.parse(localStorage.getItem(HILITE_KEY) || '{}'); } catch(e){ highlights = {}; } }
function saveHighlights(){
  try { localStorage.setItem(HILITE_KEY, JSON.stringify(highlights)); } catch(e){}
  if (window.ZonaBridge) window.ZonaBridge.onHighlightsChanged(highlights);
}
function loadBookmarks(){ try { bookmarkedIds = JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '[]'); } catch(e){ bookmarkedIds = []; } }
function saveBookmarks(){
  try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(bookmarkedIds)); } catch(e){}
  if (window.ZonaBridge) window.ZonaBridge.onBookmarksChanged(bookmarkedIds);
}

// ============================================================
// INIT
// ============================================================
function initApp() {
  loadData();
  loadHighlights();
  loadBookmarks();
  if (localStorage.getItem(VIEWMODE_KEY) === 'flip') isFlipView = true;
  applyViewMode();
  updateBookmarkCount();
  buildSidebar();
  buildSystemChips();
  updateActiveSystemChip();
  renderCards();
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    document.getElementById('clearSearch').classList.toggle('hidden', searchQuery === '');
    renderLimit = PAGE_SIZE;
    renderCards();
  });
  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) document.getElementById('backTopBtn').classList.remove('opacity-0', 'pointer-events-none');
    else document.getElementById('backTopBtn').classList.add('opacity-0', 'pointer-events-none');
  });
  if (localStorage.getItem('mednotes_theme') === 'dark' ||
      (!localStorage.getItem('mednotes_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
    document.getElementById('themeIcon').textContent = '☀️';
  }

  // ── Host hydration listener (bridged by guidelines.js) ──
  document.addEventListener('zona:hydrated', function (e) {
    var d = e.detail || {};
    if (d.kind === 'bookmarks')  { bookmarkedIds = Array.isArray(d.value) ? d.value : []; updateBookmarkCount(); renderCards(); }
    if (d.kind === 'highlights') { highlights = (d.value && typeof d.value === 'object') ? d.value : {}; renderCards(); }
  });
}

// ============================================================
// VIEW MODE
// ============================================================
function toggleViewMode(){
  isFlipView = !isFlipView;
  localStorage.setItem(VIEWMODE_KEY, isFlipView ? 'flip' : 'notes');
  applyViewMode();
  renderCards();
  showToast(isFlipView ? '🃏 Flip-card view' : '📝 Notes view');
}
function applyViewMode(){
  const icon = document.getElementById('viewToggleIcon');
  const label = document.getElementById('viewToggleLabel');
  if (isFlipView) { document.getElementById('contentGrid').classList.add('flip-view'); icon.textContent = '🃏'; label.textContent = 'Flip'; }
  else { document.getElementById('contentGrid').classList.remove('flip-view'); icon.textContent = '📝'; label.textContent = 'Notes'; }
}

// ============================================================
// SIDEBAR
// ============================================================
function buildSidebar(){
  const counts = {};
  algorithms.forEach(n => { counts[n.system] = (counts[n.system] || 0) + 1; });
  const systems = ['All', ...new Set(algorithms.map(n => n.system))];
  const list = document.getElementById('sidebarList');
  const allBtn = `<button onclick="setSystemFilter('All')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-bold mb-1 transition ${activeSystem === 'All' ? 'bg-sky-600 text-white' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'}">📖 All Systems <span class="float-right opacity-70">${algorithms.length}</span></button>`;
  const items = systems.filter(s => s !== 'All').map(s => {
    const isActive = activeSystem === s;
    return `<button onclick="setSystemFilter('${s.replace(/'/g, "\\'")}')" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-semibold mb-1 transition ${isActive ? 'bg-sky-600 text-white' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'}">${escapeHtml(s)} <span class="float-right opacity-70">${counts[s] || 0}</span></button>`;
  }).join('');
  list.innerHTML = allBtn + '<div class="h-px bg-slate-200 dark:bg-slate-800 my-2"></div>' + items;
}
function setSystemFilter(s){ activeSystem = s; renderLimit = PAGE_SIZE; buildSidebar(); buildSystemChips(); updateActiveSystemChip(); closeSidebar(); renderCards(); }
function updateActiveSystemChip(){
  const chip = document.getElementById('activeSystemChip');
  const name = document.getElementById('activeSystemName');
  if (activeSystem === 'All') chip.classList.add('hidden');
  else { chip.classList.remove('hidden'); name.textContent = activeSystem; }
}
function openSidebar(){ document.getElementById('sidebar').classList.remove('-translate-x-full'); document.getElementById('sidebarOverlay').classList.remove('hidden'); }
function closeSidebar(){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }

// ============================================================
// CHIPS
// ============================================================
function buildSystemChips(){
  const chipContainer = document.getElementById('systemChips');
  const scoped = algorithms.filter(item => {
    if (activeSystem !== 'All' && item.system !== activeSystem) return false;
    if (activeCategory !== 'ALL' && activeCategory !== 'BOOKMARKS' && item.category !== activeCategory) return false;
    return true;
  });
  const systems = ['All', ...new Set(scoped.map(item => item.system))];
  if (!systems.includes(activeSystem)) activeSystem = 'All';
  chipContainer.innerHTML = systems.map(sys => {
    const isSelected = sys === activeSystem;
    const count = sys === 'All' ? scoped.length : scoped.filter(i => i.system === sys).length;
    return `<button onclick="setSystemFilter('${sys.replace(/'/g,"\\'")}')" class="px-2.5 py-1 rounded-full border text-xs font-semibold transition whitespace-nowrap ${isSelected ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 border-slate-900 dark:border-white' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-slate-400'}">${escapeHtml(sys)} (${count})</button>`;
  }).join('');
}
function setCategoryFilter(cat){
  activeCategory = cat; renderLimit = PAGE_SIZE;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.classList.remove('bg-sky-600','text-white','border-sky-600');
    btn.classList.add('bg-white','dark:bg-slate-800','text-slate-700','dark:text-slate-300','border-slate-300','dark:border-slate-700');
  });
  const activeBtn = document.getElementById(`cat-${cat}`);
  if (activeBtn) {
    activeBtn.classList.remove('bg-white','dark:bg-slate-800','text-slate-700','dark:text-slate-300','border-slate-300','dark:border-slate-700');
    activeBtn.classList.add('bg-sky-600','text-white','border-sky-600');
  }
  buildSystemChips(); renderCards();
}
function clearSearchInput(){ document.getElementById('searchInput').value = ''; searchQuery = ''; renderLimit = PAGE_SIZE; document.getElementById('clearSearch').classList.add('hidden'); renderCards(); }
function getFilteredData(){
  return algorithms.filter(item => {
    if (activeCategory === 'BOOKMARKS') { if (!bookmarkedIds.includes(item.id)) return false; }
    else if (activeCategory !== 'ALL' && item.category !== activeCategory) return false;
    if (activeSystem !== 'All' && item.system !== activeSystem) return false;
    if (searchQuery) {
      const q = searchQuery;
      const nameMatch = item.name.toLowerCase().includes(q);
      const altMatch = item.alt && item.alt.toLowerCase().includes(q);
      const descMatch = item.desc && item.desc.toLowerCase().includes(q);
      const stepMatch = item.steps.some(s => s.label.toLowerCase().includes(q) || (s.detail && s.detail.toLowerCase().includes(q)));
      const sysMatch = item.system && item.system.toLowerCase().includes(q);
      return nameMatch || altMatch || descMatch || stepMatch || sysMatch;
    }
    return true;
  });
}

// ============================================================
// RENDER CARDS
// ============================================================
function renderCards(){
  const filtered = getFilteredData();
  document.getElementById('countPill').textContent = filtered.length;
  if (filtered.length === 0) { document.getElementById('contentGrid').innerHTML = ''; document.getElementById('emptyState').classList.remove('hidden'); document.getElementById('loadMoreBtn').classList.add('hidden'); return; }
  document.getElementById('emptyState').classList.add('hidden');
  const toShow = filtered.slice(0, renderLimit);
  document.getElementById('contentGrid').innerHTML = toShow.map(isFlipView ? renderFlipCard : renderNoteCard).join('');
  if (filtered.length > renderLimit) { document.getElementById('loadMoreBtn').classList.remove('hidden'); document.getElementById('loadMoreBtn').textContent = `Load More (${filtered.length - renderLimit} remaining)`; }
  else document.getElementById('loadMoreBtn').classList.add('hidden');
}
function loadMore(){ renderLimit += PAGE_SIZE; renderCards(); }

function renderNoteCard(item){
  const isBookmarked = bookmarkedIds.includes(item.id);
  const badgeColor = getCategoryBadgeColor(item.category);
  const hl = highlights[item.id] || {};
  const hlClass = isHighlightMode ? 'hl-active-mode' : '';

  return `
    <article class="note-card relative bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-2xl p-3 sm:p-4 flex flex-col justify-between shadow-sm">
      <div>
        <div class="flex items-start justify-between gap-2 mb-2">
          <div class="min-w-0">
            <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-indigo-600 text-white mb-1 mr-1">${escapeHtml(item.system)}</span>
            <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase tracking-wider mb-1 ${badgeColor}">${item.category}</span>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white leading-snug break-words">${escapeHtml(item.name)}</h3>
            ${item.alt ? `<p class="text-xs italic text-slate-500 dark:text-slate-400 font-medium">${escapeHtml(item.alt)}</p>` : ''}
          </div>
          <div class="flex flex-col items-end gap-1 flex-shrink-0">
            <button onclick="toggleBookmark('${item.id}')" class="text-lg p-0.5 hover:scale-125 transition">${isBookmarked ? '⭐' : '☆'}</button>
          </div>
        </div>
        <p class="text-xs text-slate-600 dark:text-slate-400 mb-3">${escapeHtml(item.desc || '')}</p>
        <div class="space-y-1.5">
          ${item.steps.map((step, idx) => `
            <div class="algo-step" data-type="${step.type || 'action'}">
              <div class="algo-step-num">${idx + 1}</div>
              <div onclick="toggleHighlight('${item.id}','step${idx}')" class="hl-pt ${hlClass} p-2 rounded-xl border ${hl['step'+idx] ? 'bg-amber-100 dark:bg-amber-900/40 border-amber-300 dark:border-amber-700' : 'bg-slate-50 dark:bg-slate-900/60 border-slate-100 dark:border-slate-800'}">
                <p class="text-xs font-bold text-slate-800 dark:text-slate-200 ${isTestMode ? 'blur-text' : ''}">${escapeHtml(step.label)}</p>
                ${step.detail ? `<p class="text-[11px] text-slate-600 dark:text-slate-400 mt-0.5 ${isTestMode ? 'blur-text' : ''}">${escapeHtml(step.detail)}</p>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </article>`;
}

function renderFlipCard(item){
  const isBookmarked = bookmarkedIds.includes(item.id);
  const badgeColor = getCategoryBadgeColor(item.category);
  return `
    <article class="note-card relative bg-transparent cursor-pointer" onclick="this.classList.toggle('flipped')">
      <div class="flip-inner">
        <div class="flip-face border border-slate-200 dark:border-slate-700/80 shadow-sm">
          <div class="flex items-start justify-between gap-2 mb-2">
            <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-indigo-600 text-white">${escapeHtml(item.system)}</span>
            <span class="inline-block px-2 py-0.5 rounded-md text-[10px] font-extrabold uppercase ${badgeColor}">${item.category}</span>
          </div>
          <div class="flex-1 flex items-center justify-center text-center px-2">
            <h3 class="text-lg font-extrabold text-slate-900 dark:text-white leading-tight break-words">${escapeHtml(item.name)}
              ${item.alt ? `<span class="block text-xs italic text-slate-500 dark:text-slate-400 font-medium mt-2">${escapeHtml(item.alt)}</span>` : ''}
            </h3>
          </div>
          <div class="text-center text-[10px] font-bold text-slate-400 pt-2">TAP TO REVEAL ⤴</div>
        </div>
        <div class="flip-face flip-back border border-slate-200 dark:border-slate-700/80 shadow-sm">
          <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-200 dark:border-slate-700">
            <span class="text-[10px] font-extrabold uppercase text-sky-600 dark:text-sky-400">${escapeHtml(item.system)}</span>
            <button onclick="event.stopPropagation(); toggleBookmark('${item.id}')" class="text-base">${isBookmarked ? '⭐' : '☆'}</button>
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-400 mb-2">${escapeHtml(item.desc || '')}</p>
          <div class="space-y-1.5">
            ${item.steps.map((step, idx) => `
              <div class="algo-step" data-type="${step.type || 'action'}">
                <div class="algo-step-num">${idx + 1}</div>
                <div class="p-1.5 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-100 dark:border-slate-800">
                  <p class="text-[11px] font-bold text-slate-800 dark:text-slate-200 ${isTestMode ? 'blur-text' : ''}">${escapeHtml(step.label)}</p>
                  ${step.detail ? `<p class="text-[10px] text-slate-600 dark:text-slate-400 mt-0.5 ${isTestMode ? 'blur-text' : ''}">${escapeHtml(step.detail)}</p>` : ''}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="text-center text-[10px] font-bold text-slate-400 pt-2 mt-auto">TAP TO FLIP BACK</div>
        </div>
      </div>
    </article>`;
}

function getCategoryBadgeColor(cat) {
  switch (cat) {
    case 'DIAGNOSIS': return 'bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300';
    case 'MANAGEMENT': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300';
    case 'RESUSCITATION': return 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300';
    case 'ACID_BASE': return 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300';
    default: return 'bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300';
  }
}

// ============================================================
// BOOKMARKS / HIGHLIGHT / TEST MODE
// ============================================================
function toggleBookmark(id) {
  if (bookmarkedIds.includes(id)) { bookmarkedIds = bookmarkedIds.filter(b => b !== id); showToast('Bookmark removed'); }
  else { bookmarkedIds.push(id); showToast('Saved ⭐'); }
  saveBookmarks(); updateBookmarkCount(); renderCards();
}
function updateBookmarkCount(){ document.getElementById('bookmarkCount').textContent = bookmarkedIds.length; }

function toggleHighlightMode(){
  isHighlightMode = !isHighlightMode;
  const btn = document.getElementById('hlModeBtn');
  btn.classList.toggle('bg-amber-500', isHighlightMode);
  btn.classList.toggle('text-white', isHighlightMode);
  btn.classList.toggle('border-amber-500', isHighlightMode);
  document.getElementById('hlModeLabel').textContent = `Highlight: ${isHighlightMode ? 'ON' : 'OFF'}`;
  renderCards();
}
function toggleHighlight(itemId, key){
  if (!isHighlightMode) return;
  highlights[itemId] = highlights[itemId] || {};
  highlights[itemId][key] = !highlights[itemId][key];
  if (!highlights[itemId][key]) delete highlights[itemId][key];
  saveHighlights(); renderCards();
}

function toggleTestMode(){
  isTestMode = !isTestMode;
  const btn = document.getElementById('testModeBtn');
  btn.classList.toggle('bg-sky-600', isTestMode);
  btn.classList.toggle('text-white', isTestMode);
  document.getElementById('testModeLabel').textContent = `Self-Test: ${isTestMode ? 'ON' : 'OFF'}`;
  renderCards();
}

// ============================================================
// BACKUP / RESET / MISC
// ============================================================
function exportBackup(){
  const payload = {
    algorithms: algorithms,
    highlights,
    bookmarks: bookmarkedIds,
    exportedAt: new Date().toISOString(),
    version: 1
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `diagnostic-algorithms-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Backup downloaded ⬇️');
}
function importBackup(event){
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!Array.isArray(payload.algorithms)) throw new Error('Invalid');
      if (!confirm(`Import ${payload.algorithms.length} algorithms? Replaces current.`)) return;
      algorithms = payload.algorithms;
      highlights = payload.highlights || {};
      bookmarkedIds = payload.bookmarks || [];
      saveData(); saveHighlights(); saveBookmarks();
      activeSystem = 'All'; activeCategory = 'ALL';
      buildSidebar(); buildSystemChips(); updateActiveSystemChip(); updateBookmarkCount(); renderCards();
      showToast('Restored ✓'); closeSidebar();
    } catch(err) { showToast('⚠️ Invalid file'); }
  };
  reader.readAsText(file); event.target.value = '';
}
function resetAllData(){
  if (!confirm('Reset ALL algorithms to default?')) return;
  if (!confirm('Really sure? Cannot be undone.')) return;
  algorithms = ALGORITHMS.map(a => ({...a}));
  highlights = {}; bookmarkedIds = [];
  saveData(); saveHighlights(); saveBookmarks();
  activeSystem = 'All'; activeCategory = 'ALL';
  buildSidebar(); buildSystemChips(); updateActiveSystemChip(); updateBookmarkCount(); renderCards();
  showToast('Reset ✓');
}

function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('mednotes_theme', isDark ? 'dark' : 'light');
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
}
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.remove('opacity-0','pointer-events-none');
  setTimeout(() => toast.classList.add('opacity-0','pointer-events-none'), 2000);
}
function scrollToTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }
function escapeHtml(str){
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

window.addEventListener('DOMContentLoaded', initApp);
</script>
